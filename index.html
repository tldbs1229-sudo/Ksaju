<title>윤슬당 YUNSEULDANG · 나의 수호동물</title>
<meta name="description" content="사주·타로·별자리로 만나는 나만의 수호동물. 12간지 × 오행 × 음양 캐릭터, 궁합, 오행 소품 샵.">
<style>
/* ===== YUL Elemental Sanctum design system (from Stitch) =====
   jade #0F382A · gold #D4AF37 · red #B33927 · hanji #FAF7F2
   headline: Noto Serif · body: Plus Jakarta Sans · sharp 2px corners · porcelain plates */
:root{color-scheme:light;
  --bg:#FAF7F2;--bg2:#f0ede9;--card:#ffffff;--line:rgba(15,56,42,.15);
  --text:#1c1c19;--muted:#5d645f;
  --jade:#0F382A;--jade-d:#002217;--jade-l:#c1ecd7;
  --gold:#D4AF37;--goldtxt:#735c00;--red:#B33927;--seal:#93000a;
  --r:2px;--r2:6px;
  --ink:#1c1c19;--paper:#fff;--purple:#0F382A;
  --el0:#0F382A;--el1:#B33927;--el2:#C5A059;--el3:#717974;--el4:#1c1c19}
/* ===== Dark mode (MUDANG night: deep indigo · violet · gold) ===== */
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0c0a19;--bg2:#1a1733;--card:#1b1834;--line:rgba(150,130,230,.22);
  --text:#f3f0ff;--muted:#b6aedb;
  --jade:#f3f0ff;--jade-d:#1a1206;--jade-l:#2a2550;
  --gold:#e6c46a;--goldtxt:#f0c96b;--red:#ff8a6b;
  --ink:#f3f0ff;--paper:#1b1834;--purple:#8b6cf0;
  --el0:#7ed6a4;--el1:#ff8a6b;--el2:#f0c96b;--el3:#d3d0e6;--el4:#7fb4ff}
[data-theme="dark"] body{background-color:var(--bg);background-image:radial-gradient(rgba(150,130,230,.07) 1px,transparent 0)}
[data-theme="dark"] header{background:#0c0a19cc;box-shadow:none}
[data-theme="dark"] .brand .bn{color:var(--goldtxt)}
[data-theme="dark"] .brand:hover .bn{color:#fff}
[data-theme="dark"] .pill{color:var(--text);border-color:var(--line);border-radius:99px}
[data-theme="dark"] button.pill:hover{background:rgba(139,108,240,.15);border-color:var(--purple)}
[data-theme="dark"] .btn{background:transparent;color:var(--text);border-color:rgba(150,130,230,.45);border-radius:10px}
[data-theme="dark"] .btn:hover{border-color:var(--gold)}
[data-theme="dark"] .btn.primary,[data-theme="dark"] .product .btn{background:linear-gradient(135deg,#f0d27a,#c9a24a);color:#1a1206;border-color:transparent}
[data-theme="dark"] .btn.primary:hover,[data-theme="dark"] .product .btn:hover{background:linear-gradient(135deg,#f6dc8c,#d4ad55);box-shadow:0 6px 18px -6px rgba(230,196,106,.55)}
[data-theme="dark"] .room{background:radial-gradient(circle at 50% 30%,#2a2160,#120f26 78%);border-color:var(--line);color:var(--text);box-shadow:0 0 60px -20px rgba(139,108,240,.6)}
[data-theme="dark"] .room.night{background:radial-gradient(circle at 50% 30%,#1c1748,#07060f 78%)}
[data-theme="dark"] .room .badge{color:var(--goldtxt)}
[data-theme="dark"] .ti{background:rgba(255,255,255,.05);border-color:var(--line);color:var(--muted)}
[data-theme="dark"] .ti.on{background:rgba(230,196,106,.15);color:var(--goldtxt)}
[data-theme="dark"] .meter{background:rgba(150,130,230,.2)}
[data-theme="dark"] .meter i{background:linear-gradient(90deg,var(--purple),var(--gold))}
[data-theme="dark"] .hero h1{color:#fff;font-weight:700}
[data-theme="dark"] .hero h1 em{font-style:normal;background:linear-gradient(90deg,#f0c96b,#f08a5d);-webkit-background-clip:text;background-clip:text;color:transparent}
[data-theme="dark"] .hero .tag{color:var(--goldtxt)}
[data-theme="dark"] h3,[data-theme="dark"] h4{color:#fff}
[data-theme="dark"] .tabs button.on{color:#fff;border-bottom-color:var(--gold)}
[data-theme="dark"] .card{background:var(--card);border-color:var(--line);border-radius:14px;box-shadow:none}
[data-theme="dark"] label{color:var(--muted)}
[data-theme="dark"] input,[data-theme="dark"] select,[data-theme="dark"] textarea{background:#110f24;border-color:var(--line);border-radius:10px;color:var(--text)}
[data-theme="dark"] input:focus,[data-theme="dark"] select:focus,[data-theme="dark"] textarea:focus{outline-color:rgba(139,108,240,.6);border-color:var(--purple)}
[data-theme="dark"] .bubble{border-color:var(--line)}
[data-theme="dark"] .bubble.user{background:linear-gradient(135deg,#6d4fe0,#8b6cf0);color:#fff}
[data-theme="dark"] .chips button{background:transparent;border-color:var(--line);color:var(--muted)}
[data-theme="dark"] .chips button:hover{color:#fff}
[data-theme="dark"] .tarot{background:linear-gradient(160deg,#2a2358,#14112b);border-color:var(--gold);color:#fff;outline-color:rgba(230,196,106,.35);box-shadow:0 10px 30px -10px rgba(139,108,240,.6)}
[data-theme="dark"] .score{color:var(--goldtxt)}
[data-theme="dark"] .bar u{background:linear-gradient(90deg,var(--purple),#b9a3ff)}
[data-theme="dark"] .pil.me{background:rgba(230,196,106,.1)}
[data-theme="dark"] .shop-art .badge{background:#0c0a19e6;color:var(--text)}
[data-theme="dark"] .price{color:var(--goldtxt)}
[data-theme="dark"] .filters button{background:transparent;border-color:var(--line);border-radius:99px;color:var(--text)}
[data-theme="dark"] .filters button.on{background:var(--gold);color:#1a1206;border-color:var(--gold)}
[data-theme="dark"] .product.rec{border-color:var(--gold)}
[data-theme="dark"] .empty{background:rgba(27,24,52,.6);border-color:var(--line)}
[data-theme="dark"] .foot{background:#08070f;color:var(--muted);border-top:1px solid var(--line)}
[data-theme="dark"] .foot .brand .bn{color:var(--goldtxt)}[data-theme="dark"] .foot small,[data-theme="dark"] .foot .notice{color:var(--muted)}
[data-theme="dark"] dialog{border-color:var(--line);border-radius:14px}
[data-theme="dark"] dialog::backdrop{background:rgba(5,4,12,.7)}
[data-theme="dark"] #drawer{border-left-color:var(--line)}
[data-theme="dark"] #toast{background:var(--card);color:var(--text)}
[data-theme="dark"] .fa{background:var(--card)}
[data-theme="dark"] .guide-chip{background:rgba(255,255,255,.05)}[data-theme="dark"] .guide-chip b{color:var(--goldtxt)}
[data-theme="dark"] .prof h2,[data-theme="dark"] .fa b,[data-theme="dark"] .fr b{color:#fff}
#themeBtn{min-width:34px}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background-color:var(--bg);background-image:radial-gradient(rgba(15,56,42,.045) 1px,transparent 0);background-size:24px 24px;color:var(--text);font:15px/1.65 "Plus Jakarta Sans","Noto Sans KR","Malgun Gothic",system-ui,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer;color:inherit}button:disabled{opacity:.55;cursor:default}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3,.brand .bn{font-family:"Noto Serif","Noto Serif KR",Georgia,"Batang",serif}
h3{font-size:18px;font-weight:600;color:var(--jade)}h4{font-size:14px;font-weight:600;color:var(--jade)}
.muted,small{color:var(--muted)}small{font-size:12px}
.wrap{max-width:1160px;margin:auto;padding:0 20px}
header{position:sticky;top:0;z-index:20;background:#FAF7F2cc;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);box-shadow:0 1px 8px rgba(15,56,42,.05)}
header .wrap{display:flex;align-items:center;gap:10px;height:62px}
.brand{display:flex;flex-direction:column;line-height:1.1}
.brand .bn{font-size:24px;font-weight:700;letter-spacing:.12em;color:var(--jade)}
.brand .bs{font-size:9px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;margin-top:2px}
.brand:hover .bn{color:var(--goldtxt)}
.pill{display:inline-block;padding:5px 13px;border-radius:var(--r2);background:transparent;color:var(--jade);font-size:13px;border:1px solid var(--line)}
button.pill:hover{border-color:var(--gold);background:#fff}
#cartN{background:var(--gold);color:var(--jade-d);border-radius:99px;padding:0 6px;font-size:11px}
.btn{border:1px solid var(--line);background:#fff;color:var(--jade);padding:11px 20px;border-radius:var(--r);display:inline-flex;justify-content:center;align-items:center;gap:8px;font-weight:600;letter-spacing:.03em;transition:.2s}
.btn.primary{background:var(--jade);color:#FAF7F2;border-color:rgba(212,175,55,.55)}
.btn.primary:hover{background:#0b2c21;box-shadow:0 4px 14px -4px rgba(15,56,42,.45)}
.btn.dark{background:#31302d;color:#f3f0eb;border-color:#31302d}
.btn:hover{border-color:var(--gold)}
.btn.sm{padding:6px 12px;font-size:12px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
/* studio layout */
.studio{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:36px;align-items:start;padding:32px 0 20px}
.left{position:sticky;top:80px}
.left,.right{min-width:0}
.room{background:radial-gradient(circle at 50% 30%,#fffdf8,#e3eee6 78%);border:1px solid rgba(212,175,55,.45);border-radius:var(--r2);padding:20px 18px 20px;text-align:center;transition:background .4s;position:relative;box-shadow:0 10px 30px -12px rgba(15,56,42,.18)}
.room.night{background:radial-gradient(circle at 50% 30%,#1f4a39,#0b241b 78%);color:#FAF7F2}
.room.night h3{color:#ffe088}.room.night small{color:#a5d0bc}.room.night .badge{color:#ffe088}
.seal{position:absolute;top:14px;right:14px;width:32px;height:34px;background:var(--seal);color:#FAF7F2;border-radius:var(--r);display:flex;align-items:center;justify-content:center;transform:rotate(5deg);border:1px solid rgba(255,218,212,.5);box-shadow:0 2px 6px rgba(147,0,10,.3)}
.seal span{writing-mode:vertical-rl;font-family:"Noto Serif",serif;font-size:11px;font-weight:700;letter-spacing:1px}
.room .badge{display:inline-block;font-size:12px;color:var(--goldtxt);letter-spacing:.1em;font-weight:600}
.pet{text-align:center;filter:drop-shadow(0 12px 12px rgba(15,56,42,.22));transition:transform .25s}
.pet-img{position:relative;width:100%;max-width:320px;margin:8px auto 0;aspect-ratio:368/286;border-radius:var(--r2);overflow:hidden;background:#f6f0e4;border:1px solid rgba(212,175,55,.35)}
.pet-img img{width:100%;height:100%;object-fit:contain;display:block}
.pet-img.human{aspect-ratio:3/4;max-width:240px}.pet-img.human img{object-fit:cover}
.stk{position:absolute;font-size:30px;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25));pointer-events:none}
.stk.head{top:5%;left:50%;transform:translateX(-50%)}.stk.neck{top:54%;left:42%}.stk.hold{bottom:9%;right:7%}.stk.ground{bottom:2%;left:7%;font-size:36px}
.room.night .pet-img img{filter:brightness(.72) saturate(.85)}
.guide-chip{display:flex;gap:10px;align-items:center;text-align:left;margin:8px 0 0;padding:8px;border:1px solid var(--line);border-radius:var(--r2);background:rgba(255,255,255,.6);font-size:12px;line-height:1.4;width:100%;color:inherit}
.guide-chip img{width:42px;height:50px;object-fit:cover;border-radius:6px;flex:0 0 auto}
.guide-chip b{font-size:14px;color:var(--jade)}
.room.night .guide-chip{background:rgba(255,255,255,.08);border-color:rgba(255,224,136,.25)}.room.night .guide-chip b{color:#ffe088}
.msg{display:flex;gap:8px;align-items:flex-end}.msg.user{justify-content:flex-end}.msg .bubble{max-width:82%}
.av{width:34px;height:40px;border-radius:8px;object-fit:cover;flex:0 0 auto;border:1px solid var(--line)}
.prof{display:grid;grid-template-columns:minmax(170px,230px) 1fr;gap:22px;align-items:start}
.prof .poster{width:100%;border-radius:var(--r2);display:block;border:1px solid var(--line)}
.prof h2{font-size:30px;color:var(--jade);margin:6px 0 2px;letter-spacing:.04em}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px;margin:12px 0}.kv dt{color:var(--muted)}.kv dd{margin:0}
.tagl{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.tagl span{font-size:12px;padding:2px 9px;border-radius:99px;background:rgba(212,175,55,.16);color:var(--goldtxt)}
.quote{font-family:"Noto Serif","Noto Serif KR",serif;font-size:16px;border-left:3px solid var(--gold);padding:4px 12px;margin:12px 0;color:var(--jade)}
.chibi{width:100%;border-radius:var(--r2);display:block;margin:10px 0;border:1px solid var(--line)}
.friends{display:grid;gap:10px;margin-top:10px}
.fr{display:flex;gap:10px;align-items:center;font-size:13px;text-align:left;background:transparent;border:1px solid var(--line);border-radius:var(--r2);padding:6px;width:100%}
.fr img{width:44px;height:52px;object-fit:cover;border-radius:6px}.fr b{color:var(--jade)}
.farm{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px;margin-top:10px}
.fa{background:#fff;border:1px solid var(--line);border-radius:var(--r2);padding:6px;text-align:center;font-size:12px;color:var(--muted);line-height:1.35}
.fa img{width:100%;aspect-ratio:368/286;object-fit:contain;border-radius:4px;background:#f6f0e4;display:block;margin-bottom:4px}
.fa b{display:block;color:var(--jade);font-size:13px}
.fa.lock img{filter:grayscale(1) brightness(.35) opacity(.35)}
.fa.me{border-color:var(--gold);box-shadow:0 0 0 2px rgba(212,175,55,.35)}
.fa.visit{border-style:dashed;border-color:var(--gold)}
.stage{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}.stage span{font-size:11px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}.stage span.on{border-color:var(--gold);color:var(--goldtxt);background:rgba(212,175,55,.12)}
.hu-ph{aspect-ratio:3/4;max-width:240px;margin:10px auto;border:1px dashed var(--gold);border-radius:var(--r2);display:grid;place-items:center;text-align:center;padding:14px;background:rgba(212,175,55,.06);position:relative;overflow:hidden}
.hu-ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.18;filter:blur(1px)}
.hu-ph div{position:relative}
.duo{width:170px;max-width:46%}.duo .pet-img{margin:0}
.pet.pop{animation:pop .45s}
@keyframes pop{30%{transform:scale(1.07) rotate(-1.5deg)}60%{transform:scale(.98)}}
.room h3{margin-top:2px}
.meter{height:5px;border-radius:10px;background:rgba(15,56,42,.12);overflow:hidden;margin:8px 0 3px}
.meter i{display:block;background:linear-gradient(90deg,var(--jade),var(--gold));height:100%;transition:width .3s}
.trayhead{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 8px;text-align:left;border-top:1px solid var(--line);padding-top:12px}
.tray{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ti{position:relative;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:8px 2px 6px;font-size:11px;color:var(--muted);line-height:1.3}
.ti span{display:block;font-size:26px;line-height:1.2}
.ti:hover{border-color:var(--gold)}
.ti.on{border-color:var(--gold);background:#fff8dc;color:var(--jade);box-shadow:0 0 0 2px rgba(212,175,55,.35)}
.ti.try{border-style:dashed}
.ti .tag{position:absolute;top:3px;right:5px;font-size:10px;color:var(--goldtxt)}
.trayinfo{margin-top:10px;min-height:44px;font-size:12px;color:var(--muted);text-align:left;display:flex;gap:10px;align-items:center;justify-content:space-between}
.room.night .ti{background:rgba(255,255,255,.08);border-color:rgba(255,224,136,.25);color:#a5d0bc}
.room.night .ti.on{background:rgba(255,224,136,.18);color:#ffe088}
.room.night h4,.room.night .trayinfo b{color:#FAF7F2!important}
.room.night .ti .tag{color:#ffe088}
.room.night .trayhead{border-top-color:rgba(255,224,136,.25)}
.room.night .btn{background:rgba(255,255,255,.1);color:#FAF7F2;border-color:rgba(255,224,136,.35)}
.room.night .btn.primary{background:var(--gold);color:var(--jade-d);border-color:var(--gold)}
.mini{display:flex;gap:8px;justify-content:center;margin-top:12px}
/* hero text */
/* ===== landing: gingham hero + pet device + product cards ===== */
.lhero{position:relative;text-align:center;padding:44px 16px 64px;overflow:hidden;
  background-color:#f3e2c9;
  background-image:repeating-linear-gradient(0deg,rgba(201,146,96,.32) 0 22px,transparent 22px 44px),repeating-linear-gradient(90deg,rgba(201,146,96,.32) 0 22px,transparent 22px 44px),repeating-linear-gradient(0deg,transparent 0 10px,rgba(255,255,255,.35) 10px 12px,transparent 12px 22px),repeating-linear-gradient(90deg,transparent 0 10px,rgba(255,255,255,.35) 10px 12px,transparent 12px 22px)}
.lh-title{font-family:"Noto Sans KR",sans-serif;font-size:clamp(22px,4.2vw,34px);font-weight:700;color:#3a2a1c;margin:0 0 22px;letter-spacing:-.01em}
.lh-cap{margin-top:18px;font-size:14px;font-weight:600;color:#3a2a1c}
.lh-cap:before{content:"⬆";display:block;font-size:16px;margin-bottom:4px}
.logintab{position:absolute;right:0;top:50%;transform:translateY(-50%);background:#f2c14e;color:#2a1d0c;border:0;border-radius:10px 0 0 10px;padding:16px 14px;font-weight:700;font-size:15px;box-shadow:0 4px 14px -6px rgba(0,0,0,.35);z-index:2}
.logintab:hover{background:#f6cd63}
/* ===== claw machine cabinet (pastel holo, after the arcade references) ===== */
.device{position:relative;width:min(360px,88vw);margin:0 auto;padding:14px 14px 12px;border-radius:30px;
  background:linear-gradient(135deg,#ffb8dc,#ffe9a8 28%,#a8f0dc 52%,#a9d4ff 74%,#d3b8ff);
  box-shadow:0 22px 40px -16px rgba(80,40,120,.55),inset 0 0 0 3px rgba(255,255,255,.7),inset 0 0 0 6px rgba(120,80,180,.25)}
.device:after{content:"";position:absolute;inset:0;border-radius:30px;pointer-events:none;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.45) 45%,transparent 60%);background-size:250% 100%;animation:holo 5s linear infinite}
@keyframes holo{from{background-position:120% 0}to{background-position:-120% 0}}
.dv-top{position:relative;display:flex;justify-content:center;align-items:center;gap:8px;height:30px;margin:0 0 10px;border-radius:12px;background:#2b2350;box-shadow:inset 0 2px 6px rgba(0,0,0,.4)}
.dv-top span{font:900 15px "Noto Sans KR",sans-serif;letter-spacing:.12em;background:linear-gradient(90deg,#ffb8dc,#fff3a8,#a8f0dc,#a9d4ff,#ffb8dc);background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:holo 4s linear infinite}
.dv-top i{font-style:normal;color:#fff3a8;animation:blink 1s steps(2) infinite}.dv-top i+span+i{animation-delay:.5s}
@keyframes blink{50%{opacity:.2}}
/* the glass box */
.dv-screen{position:relative;aspect-ratio:3/4;border-radius:22px;overflow:hidden;border:4px solid #fff;
  background:radial-gradient(120% 70% at 50% 0,#3a3170,#1d1838 70%);box-shadow:inset 0 0 0 3px rgba(120,80,180,.35),inset 0 -40px 50px -30px rgba(0,0,0,.6)}
.glass{position:absolute;inset:0;pointer-events:none;z-index:6;background:linear-gradient(115deg,rgba(255,255,255,.28) 0 7%,transparent 7% 12%,rgba(255,255,255,.14) 12% 15%,transparent 15%)}
.spot{position:absolute;top:0;width:34%;height:62%;pointer-events:none;z-index:1;clip-path:polygon(42% 0,58% 0,100% 100%,0 100%);opacity:.38;transform-origin:50% 0;animation:sweep 6s ease-in-out infinite alternate}
.spot.s1{left:14%;background:linear-gradient(#fff3a8,transparent)}.spot.s2{right:14%;background:linear-gradient(#7ff0dc,transparent);animation-delay:-3s}
@keyframes sweep{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
.rail{position:absolute;left:4%;right:4%;height:5px;border-radius:3px;background:linear-gradient(#eef1f5,#9aa2ad);box-shadow:0 2px 3px rgba(0,0,0,.35);z-index:4}
.rail.r1{top:12px}.rail.r2{top:24px}
/* carriage + cable + 3-prong claw */
.claw{position:absolute;top:6px;left:50%;width:70px;margin-left:-35px;z-index:5;animation:roam 5.5s ease-in-out infinite alternate}
@keyframes roam{0%{left:34%}100%{left:86%}}
.cart{display:block;width:44px;height:24px;margin:0 auto;border-radius:6px;background:linear-gradient(#f4f6f9,#a8b0bb);border:2px solid #6f7783;box-shadow:0 3px 4px rgba(0,0,0,.35)}

/* ================= SAJU CORE ================= */
const MB=[[1,6,1],[2,4,2],[3,6,3],[4,5,4],[5,6,5],[6,6,6],[7,7,7],[8,8,8],[9,8,9],[10,8,10],[11,7,11],[12,7,0]];
function saju(date,time){
  const [y,m,d]=date.split('-').map(Number);const v=m*100+d;
  const sy=(m<2||(m===2&&d<4))?y-1:y;
  const ys=((sy-4)%10+10)%10,yb=((sy-4)%12+12)%12;
  let mb=0;for(const [mm,dd,b] of MB)if(v>=mm*100+dd)mb=b;
  if(v<106)mb=0;
  const mi=(mb-2+12)%12,ms=((ys%5)*2+2+mi)%10;
  const jdn=Math.floor(Date.UTC(y,m-1,d)/86400000)+2440588;
  const di=((jdn+49)%60+60)%60,ds=di%10,db=di%12;
  let hour=null;
  if(time){const hh=+time.split(':')[0];const hb=Math.floor((hh+1)/2)%12;hour=[(ds*2+hb)%10,hb]}
  const p={year:[ys,yb],month:[ms,mb],day:[ds,db],hour};
  const cnt=[0,0,0,0,0];
  [p.year,p.month,p.day,p.hour].forEach(x=>{if(!x)return;cnt[STEM[x[0]][2]]++;cnt[BR[x[1]][2]]++});
  const mn=Math.min(...cnt),mx=Math.max(...cnt);
  const lack=cnt.map((n,i)=>n===mn?i:-1).filter(i=>i>=0);
  const top=cnt.map((n,i)=>n===mx?i:-1).filter(i=>i>=0);
  return {p,cnt,lack,top,animal:yb,yang:ys%2===0,theme:lack[hash(date)%lack.length]};
}
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=seed;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function zodiacOf(date){const [,m,d]=date.split('-').map(Number),v=m*100+d;
  if(v>=1222||v<120)return 0;if(v<219)return 1;if(v<321)return 2;if(v<420)return 3;if(v<521)return 4;if(v<622)return 5;if(v<723)return 6;if(v<823)return 7;if(v<923)return 8;if(v<1023)return 9;if(v<1122)return 10;return 11}

const BALLPOS=[

function resetClaw(){const c=$('claw');c.classList.remove('closed','wide');c.style.transition='';c.style.left='';c.style.animation='';$('rope').style.height='';$('grab').replaceChildren();$('grab').style.width=$('grab').style.height='';$('joy').className='joy'}

async function moveClaw(to,ms){   // slide the carriage along the rails; the joystick leans the same way
  const claw=$('claw'),from=parseFloat(claw.style.left);
  $('joy').className='joy '+(to<from?'l':'r');
  claw.style.transition=`left ${ms}ms ease-in-out`;claw.style.left=to+'%';
  await sleep(ms+40);$('joy').className='joy';
}
async function playDraw(){
  const p=state.pet;if(!p||drawing)return;
  drawing=true;$('dvBtn').disabled=true;$('credit').textContent='00';
  $('reveal').hidden=true;$('dvBubble').hidden=true;$('confetti').replaceChildren();
  resetClaw();renderBalls(p);ballsKey=p.date+p.petEl;$('lhTitle').textContent=T('lh_q');
  await sleep(80);
  const box=$('dvScreen'),claw=$('claw'),ball=box.querySelector('.ball.target'),br=box.getBoundingClientRect();
  claw.style.left=((claw.getBoundingClientRect().left+claw.offsetWidth/2-br.left)/br.width*100)+'%';
  claw.style.animation='none';void claw.offsetWidth;                                       // freeze where it is
  await moveClaw(parseFloat(ball.style.left),1000);                                         // over our capsule
  ball.style.animation='none';claw.classList.add('wide');
  const hb=$('clawHead').getBoundingClientRect(),bb=ball.getBoundingClientRect();
  $('rope').style.height=(ROPE0+bb.top-hb.bottom+bb.height*.05)+'px';await sleep(880);    // drop
  claw.classList.remove('wide');claw.classList.add('closed');await sleep(360);             // grab
  $('grab').style.width=$('grab').style.height=bb.width+'px';
  ball.style.left='0';ball.style.bottom='auto';$('grab').append(ball);
  $('rope').style.height=ROPE0+'px';await sleep(880);                                       // lift
  await moveClaw(CHUTE_X,1100);                                                             // to the prize chute
  claw.classList.remove('closed');ball.classList.add('fall');flashEl('chute');await sleep(600);   // release
  flashEl('door');await sleep(350);
  state.drawn=true;save();
  drawing=false;$('dvBtn').disabled=false;$('credit').textContent='01';

}

function bump(){const a=$('petArt');a.classList.remove('pop');void a.offsetWidth;a.classList.add('pop')}
function renderTray(){
  const w=worn();
  $('tray').innerHTML=VITEMS.map(g=>{
    const isOn=w[g.s]===g.id,tr=preview[g.s]===g.id&&!state.owned.includes(g.id),own=state.owned.includes(g.id);
    return `<button class="ti ${isOn?'on':''} ${tr?'try':''}" data-id="${g.id}" title="${esc(L(g.n))}"><span>${g.i}</span>${T('slots')[g.s]}<em class="tag" style="font-style:normal">${own?'✓':'✦'+g.p}</em></button>`}).join('');
  $('tray').querySelectorAll('button').forEach(b=>b.onclick=()=>pickItem(b.dataset.id));
  // info line: the last touched item
  const g=VITEMS.find(x=>x.id===lastItem);
  if(!g){$('trayInfo').textContent=T('v_none');return}
  const own=state.owned.includes(g.id),isOn=w[g.s]===g.id;
  if(own)$('trayInfo').innerHTML=`<span>${g.i} <b style="color:var(--text)">${esc(L(g.n))}</b><br>${isOn?T('v_worn'):T('v_owned')}</span>`;
  else $('trayInfo').innerHTML=`<span>${g.i} <b style="color:var(--text)">${esc(L(g.n))}</b><br>${isOn?T('v_try'):L(g.t)}</span><button class="btn primary sm" id="getBtn">${fmt(T('v_buy'),{p:g.p})}</button>`;
  const gb=$('getBtn');if(gb)gb.onclick=()=>getItem(g.id);
}
let lastItem=null;
function pickItem(id){
  const g=VITEMS.find(x=>x.id===id);if(!g)return;
  lastItem=id;
  const own=state.owned.includes(id);
  const nowOn=worn()[g.s]===id;
  if(own){                                   // owned: toggle wear
    delete preview[g.s];
    if(nowOn)delete state.equipped[g.s];else state.equipped[g.s]=id;
    save();
  }else{                                     // not owned: instant try-on preview
    if(nowOn)delete preview[g.s];else preview[g.s]=id;
  }
  renderPet();bump();
}
function getItem(id){
  const g=VITEMS.find(x=>x.id===id);if(!g)return;
  if(state.coins<g.p)return toast(T('v_short'));
  state.coins-=g.p;state.owned.push(id);track('shopv');
  delete preview[g.s];state.equipped[g.s]=id;
  save();render();bump();toast(T('v_on'));
}

function farmOrder(a){   // own animal first, then six-harmony / triple-harmony partners, then the rest
  const he=HE.find(x=>x.includes(a)),sam=SAM.find(x=>x.includes(a));
  const o=[a,he[0]===a?he[1]:he[0],...sam.filter(x=>x!==a)];
  for(let i=1;i<12;i++){const x=(a+i)%12;if(!o.includes(x))o.push(x)}
  return o;
}

$('birthForm').onsubmit=e=>{
  e.preventDefault();
  const date=$('birthday').value,name=$('nickname').value.trim();
  if(!name||!validDate(date))return toast(T('bad_input'));
  const time=$('noTime').checked?'':$('birthTime').value;
  const s=saju(date,time||null);
  const choice=$('element').value;
  const element=choice==='auto'?s.theme:Number(choice);
  const first=!state.pet;
  const prev=state.pet;
  state.pet={name,date,time,mbti:$('mbti').value,tone:$('tone').value,sky:$('sky').value,choice,element,animal:s.animal,yang:s.yang,saju:s,petEl:petTop(s,date),guide:STEM[s.p.day[0]][2]};
  state.match=null;
  const changed=!prev||prev.guide!==state.pet.guide||prev.animal!==state.pet.animal||prev.petEl!==state.pet.petEl;
  if(!state.chats.length||first||changed){state.chats=[{role:'guide',text:greet()}];state.mem=null}
  if(first||changed)state.drawn=false;          // a new pet waits in the claw machine
  track('done');save();render();
  const draw=pendingDraw;
  $('birthDialog').close();
  if(pendingTab){goTab(pendingTab);pendingTab=null;$('tabs').scrollIntoView({behavior:'smooth',block:'start'})}
  else if(draw){goTab(first?'guide':'chat');scrollTo({top:0,behavior:'smooth'});setTimeout(playDraw,500)}

};

fear:{ko:['가장 작은 첫걸음부터 골라보자. 지금 5분 안에 할 수 있는 일은 뭘까?','걱정은 쪼개면 작아져. 제일 먼저 확인할 사실 하나만 말해줄래?'],en:['Let\'s choose the smallest first step. What can you do in 5 minutes?','Worries shrink when split up. What is the one fact to check first?']},
happy:{ko:['그 순간을 함께 간직하고 싶어! 어떤 점이 제일 기뻤는지 기록에 남겨볼까?','와, 나도 덩달아 신나! 그 기쁨을 누구와 나누고 싶어?'],en:['I want to keep that moment with you! Shall we write what felt best in your journal?','Wow, now I\'m excited too! Who would you like to share it with?']},
love:{ko:['설레는 마음이구나! 그 사람의 어떤 점이 좋은지 한 가지만 적어볼까? 인연 보기에서 우리 궁합도 볼 수 있어.','좋아하는 마음은 그 자체로 반짝여. 인연 보기에서 두 동물의 이야기를 만들어볼래?'],en:['What a fluttery feeling! Want to write one thing you like about them? You can also try Chemistry above.','Liking someone is sparkly by itself. Want to make a story of your two animals in Chemistry?']},
other:{ko:['이야기해 줘서 고마워. 그중 오늘 가장 마음에 남은 순간을 하나 더 말해줄래?','응, 듣고 있어. 그때 어떤 기분이 들었는지 조금만 더 들려줄래?'],en:['Thanks for telling me. Which moment stayed with you most today?','I\'m listening. Tell me a bit more about how it felt?']}};
const MEMLINE={tired:{ko:'지난번에 많이 지쳐 보였는데, 오늘은 좀 어때?',en:'You seemed worn out last time — how is today?'},fear:{ko:'지난번에 걱정이 있었잖아. 그건 어떻게 됐어?',en:'You were worried last time. How did it go?'},happy:{ko:'지난번에 좋은 일이 있었지! 그 기분 아직 남아 있어?',en:'You had good news last time! Is the feeling still here?'},love:{ko:'지난번에 설레는 이야기를 했었지. 그 뒤로 어때?',en:'You told me something fluttery last time. Any news?'}};
/* topics about the guide's own life, friends, your saju and your pet */
function topicReply(cat,t){
  const p=state.pet,g=guideOf(p),dow=new Date().getDay(),ko=lang==='ko',h=hash(t+today()),lv=lvOf();
  if(cat==='daily')return L(g.day)[dow]+' '+(ko?`${p.name}도 오늘 ${L(ELJOB)[p.petEl]}으로 바빴어. 너는 오늘 어땠어?`:`${p.name} was busy too, ${L(ELJOB)[p.petEl]}. How was yours?`);
  if(cat==='friend'){
    const named=CREW.find(c=>c!==g&&((c.kr.length>1&&t.includes(c.kr))||t.toLowerCase().includes(c.id))),others=CREW.filter(c=>c!==g),c=named||others[h%others.length];
    return ko?`${L(c.n)} 얘기? ${L(g.fr[c.id])} 요즘 ${L(c.n)} 근황 — "${L(c.day)[dow]}" 우리 TIGER CREW는 ${others.map(x=>L(x.n)).join(', ')}, 그리고 나. 🧑 내 가이드 탭에서 다 소개해 둘게.`
      :`About ${L(c.n)}? ${L(g.fr[c.id])} Latest from ${L(c.n)}: "${L(c.day)[dow]}" Our TIGER CREW is ${others.map(x=>L(x.n)).join(', ')} and me. Meet them all in the My Guide tab.`}
  if(cat==='saju'){
    const s=p.saju,dm=STEM[s.p.day[0]];
    return ko?`네 일간은 ${dm[0]}(${dm[1]}) — 나와 같은 ${elName(p.guide)} 기운이야. 팔자에서 가장 강한 기운: ${s.top.map(elName).join(', ')}. 그래서 펫은 ${animalLabel(p)} 모습이 됐어. 상대적으로 약한 기운: ${s.lack.map(elName).join(', ')}. 공방에선 ${elName(p.element)} 쪽 소품을 골라뒀어. 자세한 네 기둥은 ☯ 사주 탭에! (어디까지나 오락용 간이 풀이야.)`
      :`Your Day Master is ${STEMEN[s.p.day[0]]} — the same ${elName(p.guide)} energy as mine. Strongest in your chart: ${s.top.map(elName).join(', ')}, which is why your pet is a ${animalLabel(p)}. Relatively weak: ${s.lack.map(elName).join(', ')}, so I picked ${elName(p.element)} items in the Workshop. See the four pillars in the Saju tab! (Just a simplified reading, for fun.)`}
  const hu=lv>=HUMAN_LV?(humanSrc(p.animal,p.petEl)?(ko?'의인화 모습도 열렸어 — 🏡 동물농장 탭에서 볼 수 있어!':'Human form is unlocked — see it in the Animal Farm tab!'):(ko?'의인화가 열렸어! 이 조합 일러스트는 준비 중이야.':'Human form is unlocked! Art for this combination is coming soon.'))
    :(ko?`의인화까지는 Lv.${HUMAN_LV+1}, 별가루 ✦${HUMAN_LV*30-state.xp} 남았어.`:`Human form at Lv.${HUMAN_LV+1} — ✦${HUMAN_LV*30-state.xp} to go.`);
  return ko?`${p.name} 소식! 지금 Lv.${lv+1} · ${T('stage')[stageOf(lv)]}. 오늘도 ${L(ELJOB)[p.petEl]}으로 열심이야. ${hu} (${p.name}: ${L(AN[p.animal].sig)})`
    :`News from ${p.name}! Lv.${lv+1} · ${T('stage')[stageOf(lv)]}, ${L(ELJOB)[p.petEl]}. ${hu} (${p.name}: ${L(AN[p.animal].sig)})`;
}
function rule(t){
  const p=state.pet,g=guideOf(p);let cat='other';for(const [k,re] of CATS)if(re.test(t)){cat=k;break}
  if(cat==='other'&&t.includes(p.name))cat='pet';
  if(!REPLY[cat])return topicReply(cat,t);
  const h=hash(t+today()),pool=REPLY[cat][lang];let r=pool[h%pool.length];
  if(h%3!==0)r=L(g.open)[h%L(g.open).length]+' '+r;          // the guide speaks from their own life
  if(state.mem&&state.mem.day!==today()&&MEMLINE[state.mem.cat])r=L(MEMLINE[state.mem.cat])+' '+r;
  if(p.tone==='clear')r=(lang==='ko'?'차근차근 정리해 보자. ':'Let\'s sort it out step by step. ')+r;
  if(p.tone==='play')r=(lang==='ko'?'응원 에너지 충전! ✨ ':'Cheer energy charged! ✨ ')+r;
  if(p.mbti&&p.mbti[2]==='F'&&cat!=='other')r+=lang==='ko'?' (네 마음이 먼저야.)':' (Your feelings come first.)';
  if(p.mbti&&p.mbti[2]==='T'&&cat==='fear')r+=lang==='ko'?' 우선순위를 번호로 적어볼까?':' Want to number your priorities?';
  r+=` (${p.name}: ${L(AN[p.animal].sig)})`;
  if(cat!=='other')state.mem={cat,day:today()};
  return r;
}
async function reply(t){
  if(!AI_ENDPOINT)return rule(t);
  try{
    const p=state.pet,g=guideOf(p),dow=new Date().getDay();
    const guide={name:g.n.en,age:g.age,gender:g.g.en,job:g.job.en,area:g.area.en,mbti:g.mbti,element:EL[p.guide].en,farm:g.farm.en,likes:g.likes.en,quote:g.quote.en,today:g.day.en[dow],friends:CREW.filter(c=>c!==g).map(c=>({name:c.n.en,job:c.job.en,relation:g.fr[c.id].en}))};
    const res=await fetch(AI_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({guide,pet:{name:p.name,animal:AN[p.animal].en,element:EL[p.petEl].en,level:lvOf()+1,yang:p.yang},user:{tone:p.tone,mbti:p.mbti,dayMaster:STEMEN[p.saju.p.day[0]],strongest:p.saju.top.map(i=>EL[i].en),weakest:p.saju.lack.map(i=>EL[i].en)},lang,messages:state.chats.slice(-12).concat({role:'user',text:t})})});
    const j=await res.json();if(j&&typeof j.reply==='string')return j.reply.slice(0,800);
  }catch(e){}
  return rule(t);
}
async function chat(text){
  if(!needPet())return;
  const t=text.trim().slice(0,300);if(!t)return;
  state.chats.push({role:'user',text:t});track('chat');renderChat();$('message').value='';
  const r=await reply(t);
  state.chats.push({role:'guide',text:r});state.chats=state.chats.slice(-40);save();renderChat();
}
$('chatForm').onsubmit=e=>{e.preventDefault();chat($('message').value)};
function clearChat(){if(!confirm(T('confirm_chat')))return;state.chats=[];save();renderChat()}

/* ================= RITUAL ================= */
function addXp(n){
  const before=lvOf();state.coins+=n;state.xp+=n;const after=lvOf();
  if(after===before||!state.pet)return;
  const p=state.pet,g=guideOf(p),ko=lang==='ko';
  let msg=ko?`${p.name}, Lv.${after+1} 달성! `:`${p.name} reached Lv.${after+1}! `;
  if(after<12){const a=farmOrder(p.animal)[after];msg+=fmt(T('new_farm'),{a:`${AN[a].e} ${anName(a)}`})}
  if(after===HUMAN_LV)msg+=' '+fmt(T('hu_unlock'),{p:p.name});
  state.chats.push({role:'guide',text:msg});state.chats=state.chats.slice(-40);
  setTimeout(()=>toast(msg),900);
}
function completeTask(i){
  if(!needPet())return;const d=dayData();if(d.tasks.includes(i))return;
  d.tasks.push(i);addXp(10);save();render();toast(T('task_done'));
}
function drawTarot(){
  if(!needPet())return;const d=dayData();if(d.card!==null)return;
  d.card=hash(today()+state.pet.date)%TAROT.length;track('tarot');
  const c=TAROT[d.card];
  state.chats.push({role:'guide',text:fmt(T('tarot_pet'),{n:L(guideOf(state.pet).n),c:L({ko:c[1],en:c[2]}),s:fmt(T('tarot_q'),{k:L({ko:c[3],en:c[4]}),n:state.pet.name})})});
  state.chats=state.chats.slice(-40);save();render();
}
$('zPick').onchange=()=>{state.zsel=+$('zPick').value;save();renderRitual()};

/* ================= SHOP / CART ================= */
function addCart(id){const f=state.cart.find(c=>c.id===id);f?f.q++:state.cart.push({id,q:1});track('cart');save();renderCart();toast(T('added'))}
function renderCart(){
  $('cartN').textContent=state.cart.reduce((a,c)=>a+c.q,0);
  if(!state.cart.length){$('items').innerHTML=`<p class="muted" style="padding-top:16px">${T('empty')}</p>`;$('total').textContent='$0';return}
  let tot=0;
  $('items').innerHTML=state.cart.map(c=>{const g=GOODS.find(x=>x.id===c.id);tot+=g.p*c.q;return `<div class="ci"><span>${g.i}</span><div>${esc(L(g.n))}<br><small>$${g.p} × ${c.q}</small></div><button data-id="${c.id}">✕</button></div>`}).join('');
  $('total').textContent='$'+tot;
  $('items').querySelectorAll('button').forEach(b=>b.onclick=()=>{state.cart=state.cart.filter(c=>c.id!==+b.dataset.id);save();renderCart()});
}
$('cartBtn').onclick=()=>$('drawer').classList.add('open');
$('closeCart').onclick=()=>$('drawer').classList.remove('open');
$('checkout').onclick=()=>alert(T('checkout_msg'));

/* ================= CHEMISTRY ================= */
$('preset').onchange=()=>{const p=PRESETS.find(x=>x.id===$('preset').value);$('partner').value=p?L(p.n):'';$('partnerDate').value=p?p.d:'';$('partnerMbti').value=p?p.m:''};
const HE=[[0,1],[2,11],[3,10],[4,9],[5,8],[6,7]],SAM=[[8,0,4],[11,3,7],[2,6,10],[5,9,1]];
function animalRel(a,b){
  if(a===b)return['same',10];
  if(HE.some(([x,y])=>(x===a&&y===b)||(x===b&&y===a)))return['he',20];
  if(SAM.some(g=>g.includes(a)&&g.includes(b)))return['sam',16];
  if(Math.abs(a-b)===6)return['clash',4];
  return['norm',8];
}
function elemRel(a,b){const d=(b-a+5)%5;return d===0?['same',8]:(d===1||d===4)?['gen',14]:['ctl',6]}
function compat(me,her){   // elements = each person's strongest element (pet element). MBTI is profile-only, never scored.
  const [ar,as]=animalRel(me.animal,her.animal),[er,es]=elemRel(me.petEl,her.petEl);
  const ys=me.yang!==her.yang?10:5;
  const score=Math.min(99,50+as+es+ys);
  return {score,ar,as,er,es,ys};
}
$('matchForm').onsubmit=e=>{
  e.preventDefault();if(!needPet())return;
  const name=$('partner').value.trim(),date=$('partnerDate').value;
  if(!name||!validDate(date))return toast(T('bad_input'));
  const s=saju(date,null),her={name,mbti:$('partnerMbti').value,animal:s.animal,yang:s.yang,petEl:petTop(s,date)};
  state.match={her,...compat(state.pet,her)};
  track('match');save();render();
};
function renderMatch(){
  const m=state.match;$('matchEmpty').hidden=!!m;$('matchResult').hidden=!m;
  if(!m||!state.pet)return;
  const p=state.pet,cap=(x,n)=>`<small style="display:block;margin-top:4px">${esc(n)} · ${esc(animalLabel(x))}</small>`;
  $('mePet').innerHTML=petHTML(p)+cap(p,p.name);$('herPet').innerHTML=petHTML(m.her)+cap(m.her,m.her.name);
  $('mTitle').textContent=fmt(T('m_title'),{a:p.name,b:m.her.name});
  $('mScore').textContent=m.score;
  $('mStory').textContent=T('m_story')[m.score>=80?0:m.score>=70?1:2];
  const mb=p.mbti||m.her.mbti?`${p.mbti||'?'} × ${m.her.mbti||'?'} · ${T('m_prof')}`:T('m_na');
  const bars=[[T('m_parts')[0],m.as,20,T('rel')[m.ar]],[T('m_parts')[1],m.es,14,T('erel')[m.er]],[T('m_parts')[2],m.ys,10,m.ys===10?(lang==='ko'?'음양 보완':'Complementary'):(lang==='ko'?'같은 결':'Same polarity')]];
  $('mBars').innerHTML=bars.map(([l,v,mx,note])=>`<div class="bar"><i>${l}</i><div><u style="width:${v/mx*100}%"></u></div><b style="flex-basis:auto;min-width:60px;font-weight:400;font-size:11px;color:var(--muted)">${esc(note)}</b></div>`).join('')
    +`<div class="bar"><i>${T('m_parts')[3]}</i><span style="flex:1;font-size:12px;color:var(--muted)">${esc(mb)}</span></div>`;
  $('mExplain').textContent=fmt(T('m_exp'),{a:m.as,b:m.es,c:m.ys});
}
function dl(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
const loadImg=src=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=src});
async function downloadCard(){
  if(!state.match)return;track('share');save();
  const m=state.match,p=state.pet;
  try{
    const [a,b]=await Promise.all([loadImg(petSrc(p.animal,p.petEl)),loadImg(petSrc(m.her.animal,m.her.petEl))]);
    const c=document.createElement('canvas');c.width=900;c.height=1100;const x=c.getContext('2d');
    x.fillStyle='#f7f1e9';x.fillRect(0,0,900,1100);x.strokeStyle='#c9a96e';x.lineWidth=2;x.strokeRect(40,40,820,1020);
    x.fillStyle='#59476b';x.textAlign='center';
    x.font='46px Georgia,serif';x.fillText('☾ YUNSEULDANG',450,140);
    x.font='18px sans-serif';x.fillText('OUR LITTLE CONNECTION',450,190);
    x.drawImage(a,70,250,368,286);x.drawImage(b,462,250,368,286);
    x.font='22px sans-serif';x.fillText(`${p.name} · ${animalLabel(p)}`,254,580);x.fillText(`${m.her.name} · ${animalLabel(m.her)}`,646,580);
    x.font='34px sans-serif';x.fillText(`${p.name} × ${m.her.name}`,450,700);
    x.font='100px Georgia,serif';x.fillText(String(m.score),450,840);
    x.font='22px sans-serif';x.fillText(lang==='ko'?'윤슬 케미 지수 · 오락용':'Yunseul Chemistry · for fun',450,890);
    x.font='16px sans-serif';x.fillText(lang==='ko'?'샘플 규칙 결과 · 실제 관계 예측이 아닙니다':'Fixed-rule result · not a real relationship prediction',450,1010);
    c.toBlob(bl=>bl&&dl(bl,'yunseuldang-duo.png'),'image/png');
    toast(T('card_saved'));
  }catch(e){toast(T('saved_fail'))}
}
async function shareMatch(){
  if(!state.match)return;track('share');save();
  const text=fmt(T('share_t'),{a:state.pet.name,b:state.match.her.name,s:state.match.score});
  try{
    if(navigator.share){await navigator.share({title:'Yunseuldang',text});return}
    if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);toast(T('copy'));return}
  }catch(e){if(e.name==='AbortError')return}
  info(T('copyshare'),text);
}

/* ================= JOURNAL ================= */
$('journalForm').onsubmit=e=>{
  e.preventDefault();if(!needPet())return;
  const text=$('memo').value.trim();if(!text)return;
  state.entries.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),day:today(),mood:+$('mood').value,text:text.slice(0,500)});
  state.entries=state.entries.slice(-60);save();render();$('memo').value='';toast(T('journal_saved'));
};
function deleteEntry(id){if(!confirm(T('confirm_entry')))return;state.entries=state.entries.filter(e=>e.id!==id);save();render()}
function weekly(){
  const d=new Date();d.setDate(d.getDate()-6);const start=dstr(d),end=today();
  const ents=state.entries.filter(e=>e.day>=start&&e.day<=end);
  const tasks=Object.keys(state.days).filter(k=>k>=start&&k<=end).reduce((n,k)=>n+state.days[k].tasks.length,0);
  const mo={};for(const e of ents)mo[e.mood]=(mo[e.mood]||0)+1;
  const ms=Object.entries(mo).map(([m,n])=>`${T('moods')[m]} ${n}${T('times')}`).join(' · ')||T('wk_none');
  info(T('wk_h'),`${start} ~ ${end}\n\n`+fmt(T('wk_body'),{e:ents.length,t:tasks,m:ms}));
}

/* ================= INFO / METRICS / RESET ================= */
function openPartner(){$('pStatus').textContent='';$('partnerDialog').showModal()}
$('partnerForm').onsubmit=async e=>{
  e.preventDefault();const f=e.target,b=$('pSend');
  b.disabled=true;b.textContent=T('p_sending');$('pStatus').textContent='';
  try{
    const r=await fetch(f.action,{method:'POST',body:new FormData(f),headers:{Accept:'application/json'}});
    if(!r.ok)throw new Error(r.status);
    f.reset();$('partnerDialog').close();toast(T('p_ok'));
  }catch(err){$('pStatus').textContent=T('p_fail')}
  finally{b.disabled=false;b.textContent=T('p_send')}
};
function info(title,text){$('infoTitle').textContent=title;$('infoBody').textContent=text;$('infoDialog').showModal()}
function showMetrics(){
  const m=state.metrics,g=k=>m[k]||0,mt=T('mt');
  const rate=g('start')?Math.round(g('done')/g('start')*100)+'%':'-';
  info(T('metrics_h'),Object.keys(mt).map(k=>`${mt[k]}: ${g(k)}`).join('\n')+`\n\n${T('mt_rate')}: ${rate}\n\n${T('mt_note')}`);
}
function resetAll(){
  if(!confirm(T('confirm_reset')))return;
  state=fresh();try{localStorage.removeItem(LS)}catch(e){}
  render();toast(T('reset_done'));
}

/* ================= INIT ================= */
for(const id of['birthday','partnerDate'])$(id).max=today();
applyLang();
if(!storageOK)toast(T('saved_fail'));
document.addEventListener('visibilitychange',()=>{if(!document.hidden){for(const id of['birthday','partnerDate'])$(id).max=today();render()}});
