<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#FAF7F2">
<script>try{if(localStorage.getItem('yd-theme')==='dark')document.documentElement.dataset.theme='dark'}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Noto+Serif+KR:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<title>윤슬당 YUNSEULDANG · 나의 수호동물</title>
<meta name="description" content="사주·타로·별자리로 만나는 나만의 수호동물. 12간지 × 오행 × 음양 캐릭터, 궁합, 오행 소품 샵.">
<style>
/* ===== YUL Elemental Sanctum design system (from Stitch) =====
   jade #0F382A · gold #D4AF37 · red #B33927 · hanji #FAF7F2
   headline: Noto Serif · body: Plus Jakarta Sans · sharp 2px corners · porcelain plates */
:root{color-scheme:light;
  --bg:#FAF7F2;--bg2:#f0ede9;--card:#ffffff;--line:rgba(15,56,42,.15);
  --text:#1c1c19;--muted:#5d645f;
  --jade:#0F382A;--jade-d:#002217;--jade-l:#c1ecd7;
  --gold:#D4AF37;--goldtxt:#735c00;--red:#B33927;--seal:#93000a;
  --r:2px;--r2:6px;
  --ink:#1c1c19;--paper:#fff;--purple:#0F382A;
  --el0:#0F382A;--el1:#B33927;--el2:#C5A059;--el3:#717974;--el4:#1c1c19}
/* ===== Dark mode (MUDANG night: deep indigo · violet · gold) ===== */
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0c0a19;--bg2:#1a1733;--card:#1b1834;--line:rgba(150,130,230,.22);
  --text:#f3f0ff;--muted:#b6aedb;
  --jade:#f3f0ff;--jade-d:#1a1206;--jade-l:#2a2550;
  --gold:#e6c46a;--goldtxt:#f0c96b;--red:#ff8a6b;
  --ink:#f3f0ff;--paper:#1b1834;--purple:#8b6cf0;
  --el0:#7ed6a4;--el1:#ff8a6b;--el2:#f0c96b;--el3:#d3d0e6;--el4:#7fb4ff}
[data-theme="dark"] body{background-color:var(--bg);background-image:radial-gradient(rgba(150,130,230,.07) 1px,transparent 0)}
[data-theme="dark"] header{background:#0c0a19cc;box-shadow:none}
[data-theme="dark"] .brand .bn{color:var(--goldtxt)}
[data-theme="dark"] .brand:hover .bn{color:#fff}
[data-theme="dark"] .pill{color:var(--text);border-color:var(--line);border-radius:99px}
[data-theme="dark"] button.pill:hover{background:rgba(139,108,240,.15);border-color:var(--purple)}
[data-theme="dark"] .btn{background:transparent;color:var(--text);border-color:rgba(150,130,230,.45);border-radius:10px}
[data-theme="dark"] .btn:hover{border-color:var(--gold)}
[data-theme="dark"] .btn.primary,[data-theme="dark"] .product .btn{background:linear-gradient(135deg,#f0d27a,#c9a24a);color:#1a1206;border-color:transparent}
[data-theme="dark"] .btn.primary:hover,[data-theme="dark"] .product .btn:hover{background:linear-gradient(135deg,#f6dc8c,#d4ad55);box-shadow:0 6px 18px -6px rgba(230,196,106,.55)}
[data-theme="dark"] .room{background:radial-gradient(circle at 50% 30%,#2a2160,#120f26 78%);border-color:var(--line);color:var(--text);box-shadow:0 0 60px -20px rgba(139,108,240,.6)}
[data-theme="dark"] .room.night{background:radial-gradient(circle at 50% 30%,#1c1748,#07060f 78%)}
[data-theme="dark"] .room .badge{color:var(--goldtxt)}
[data-theme="dark"] .ti{background:rgba(255,255,255,.05);border-color:var(--line);color:var(--muted)}
[data-theme="dark"] .ti.on{background:rgba(230,196,106,.15);color:var(--goldtxt)}
[data-theme="dark"] .meter{background:rgba(150,130,230,.2)}
[data-theme="dark"] .meter i{background:linear-gradient(90deg,var(--purple),var(--gold))}
[data-theme="dark"] .hero h1{color:#fff;font-weight:700}
[data-theme="dark"] .hero h1 em{font-style:normal;background:linear-gradient(90deg,#f0c96b,#f08a5d);-webkit-background-clip:text;background-clip:text;color:transparent}
[data-theme="dark"] .hero .tag{color:var(--goldtxt)}
[data-theme="dark"] h3,[data-theme="dark"] h4{color:#fff}
[data-theme="dark"] .tabs button.on{color:#fff;border-bottom-color:var(--gold)}
[data-theme="dark"] .card{background:var(--card);border-color:var(--line);border-radius:14px;box-shadow:none}
[data-theme="dark"] label{color:var(--muted)}
[data-theme="dark"] input,[data-theme="dark"] select,[data-theme="dark"] textarea{background:#110f24;border-color:var(--line);border-radius:10px;color:var(--text)}
[data-theme="dark"] input:focus,[data-theme="dark"] select:focus,[data-theme="dark"] textarea:focus{outline-color:rgba(139,108,240,.6);border-color:var(--purple)}
[data-theme="dark"] .bubble{border-color:var(--line)}
[data-theme="dark"] .bubble.user{background:linear-gradient(135deg,#6d4fe0,#8b6cf0);color:#fff}
[data-theme="dark"] .chips button{background:transparent;border-color:var(--line);color:var(--muted)}
[data-theme="dark"] .chips button:hover{color:#fff}
[data-theme="dark"] .tarot{background:linear-gradient(160deg,#2a2358,#14112b);border-color:var(--gold);color:#fff;outline-color:rgba(230,196,106,.35);box-shadow:0 10px 30px -10px rgba(139,108,240,.6)}
[data-theme="dark"] .score{color:var(--goldtxt)}
[data-theme="dark"] .bar u{background:linear-gradient(90deg,var(--purple),#b9a3ff)}
[data-theme="dark"] .pil.me{background:rgba(230,196,106,.1)}
[data-theme="dark"] .shop-art .badge{background:#0c0a19e6;color:var(--text)}
[data-theme="dark"] .price{color:var(--goldtxt)}
[data-theme="dark"] .filters button{background:transparent;border-color:var(--line);border-radius:99px;color:var(--text)}
[data-theme="dark"] .filters button.on{background:var(--gold);color:#1a1206;border-color:var(--gold)}
[data-theme="dark"] .product.rec{border-color:var(--gold)}
[data-theme="dark"] .empty{background:rgba(27,24,52,.6);border-color:var(--line)}
[data-theme="dark"] .foot{background:#08070f;color:var(--muted);border-top:1px solid var(--line)}
[data-theme="dark"] .foot .brand .bn{color:var(--goldtxt)}[data-theme="dark"] .foot small,[data-theme="dark"] .foot .notice{color:var(--muted)}
[data-theme="dark"] dialog{border-color:var(--line);border-radius:14px}
[data-theme="dark"] dialog::backdrop{background:rgba(5,4,12,.7)}
[data-theme="dark"] #drawer{border-left-color:var(--line)}
[data-theme="dark"] #toast{background:var(--card);color:var(--text)}
#themeBtn{min-width:34px}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background-color:var(--bg);background-image:radial-gradient(rgba(15,56,42,.045) 1px,transparent 0);background-size:24px 24px;color:var(--text);font:15px/1.65 "Plus Jakarta Sans","Noto Sans KR","Malgun Gothic",system-ui,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer;color:inherit}button:disabled{opacity:.55;cursor:default}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3,.brand .bn{font-family:"Noto Serif","Noto Serif KR",Georgia,"Batang",serif}
h3{font-size:18px;font-weight:600;color:var(--jade)}h4{font-size:14px;font-weight:600;color:var(--jade)}
.muted,small{color:var(--muted)}small{font-size:12px}
.wrap{max-width:1160px;margin:auto;padding:0 20px}
header{position:sticky;top:0;z-index:20;background:#FAF7F2cc;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);box-shadow:0 1px 8px rgba(15,56,42,.05)}
header .wrap{display:flex;align-items:center;gap:10px;height:62px}
.brand{display:flex;flex-direction:column;line-height:1.1}
.brand .bn{font-size:24px;font-weight:700;letter-spacing:.12em;color:var(--jade)}
.brand .bs{font-size:9px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;margin-top:2px}
.brand:hover .bn{color:var(--goldtxt)}
.pill{display:inline-block;padding:5px 13px;border-radius:var(--r2);background:transparent;color:var(--jade);font-size:13px;border:1px solid var(--line)}
button.pill:hover{border-color:var(--gold);background:#fff}
#cartN{background:var(--gold);color:var(--jade-d);border-radius:99px;padding:0 6px;font-size:11px}
.btn{border:1px solid var(--line);background:#fff;color:var(--jade);padding:11px 20px;border-radius:var(--r);display:inline-flex;justify-content:center;align-items:center;gap:8px;font-weight:600;letter-spacing:.03em;transition:.2s}
.btn.primary{background:var(--jade);color:#FAF7F2;border-color:rgba(212,175,55,.55)}
.btn.primary:hover{background:#0b2c21;box-shadow:0 4px 14px -4px rgba(15,56,42,.45)}
.btn.dark{background:#31302d;color:#f3f0eb;border-color:#31302d}
.btn:hover{border-color:var(--gold)}
.btn.sm{padding:6px 12px;font-size:12px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
/* studio layout */
.studio{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:36px;align-items:start;padding:32px 0 20px}
.left{position:sticky;top:80px}
.room{background:radial-gradient(circle at 50% 30%,#fffdf8,#e3eee6 78%);border:1px solid rgba(212,175,55,.45);border-radius:var(--r2);padding:20px 18px 20px;text-align:center;transition:background .4s;position:relative;box-shadow:0 10px 30px -12px rgba(15,56,42,.18)}
.room.night{background:radial-gradient(circle at 50% 30%,#1f4a39,#0b241b 78%);color:#FAF7F2}
.room.night h3{color:#ffe088}.room.night small{color:#a5d0bc}.room.night .badge{color:#ffe088}
.seal{position:absolute;top:14px;right:14px;width:32px;height:34px;background:var(--seal);color:#FAF7F2;border-radius:var(--r);display:flex;align-items:center;justify-content:center;transform:rotate(5deg);border:1px solid rgba(255,218,212,.5);box-shadow:0 2px 6px rgba(147,0,10,.3)}
.seal span{writing-mode:vertical-rl;font-family:"Noto Serif",serif;font-size:11px;font-weight:700;letter-spacing:1px}
.room .badge{display:inline-block;font-size:12px;color:var(--goldtxt);letter-spacing:.1em;font-weight:600}
.pet{text-align:center;filter:drop-shadow(0 12px 12px rgba(15,56,42,.22));transition:transform .25s}
.pet svg{width:260px;height:270px;max-width:100%}
.pet.pop{animation:pop .45s}
@keyframes pop{30%{transform:scale(1.07) rotate(-1.5deg)}60%{transform:scale(.98)}}
.room h3{margin-top:2px}
.meter{height:5px;border-radius:10px;background:rgba(15,56,42,.12);overflow:hidden;margin:8px 0 3px}
.meter i{display:block;background:linear-gradient(90deg,var(--jade),var(--gold));height:100%;transition:width .3s}
.trayhead{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 8px;text-align:left;border-top:1px solid var(--line);padding-top:12px}
.tray{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ti{position:relative;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:8px 2px 6px;font-size:11px;color:var(--muted);line-height:1.3}
.ti span{display:block;font-size:26px;line-height:1.2}
.ti:hover{border-color:var(--gold)}
.ti.on{border-color:var(--gold);background:#fff8dc;color:var(--jade);box-shadow:0 0 0 2px rgba(212,175,55,.35)}
.ti.try{border-style:dashed}
.ti .tag{position:absolute;top:3px;right:5px;font-size:10px;color:var(--goldtxt)}
.trayinfo{margin-top:10px;min-height:44px;font-size:12px;color:var(--muted);text-align:left;display:flex;gap:10px;align-items:center;justify-content:space-between}
.room.night .ti{background:rgba(255,255,255,.08);border-color:rgba(255,224,136,.25);color:#a5d0bc}
.room.night .ti.on{background:rgba(255,224,136,.18);color:#ffe088}
.room.night h4,.room.night .trayinfo b{color:#FAF7F2!important}
.room.night .ti .tag{color:#ffe088}
.room.night .trayhead{border-top-color:rgba(255,224,136,.25)}
.room.night .btn{background:rgba(255,255,255,.1);color:#FAF7F2;border-color:rgba(255,224,136,.35)}
.room.night .btn.primary{background:var(--gold);color:var(--jade-d);border-color:var(--gold)}
.mini{display:flex;gap:8px;justify-content:center;margin-top:12px}
/* hero text */
.hero{padding:6px 0 4px}
.hero .tag{color:var(--goldtxt);letter-spacing:.28em;font-size:11px;font-weight:600}
.hero h1{font-size:clamp(30px,4.6vw,50px);margin:10px 0;line-height:1.25;font-weight:500;color:var(--jade)}
.hero h1 em{font-style:italic;font-weight:400;color:var(--goldtxt)}
.hero p.lead{color:var(--muted);max-width:520px}
/* tabs */
.tabs{display:flex;gap:2px;overflow-x:auto;margin:26px 0 16px;scrollbar-width:none;position:sticky;top:62px;z-index:8;background:linear-gradient(var(--bg) 78%,transparent);padding-top:8px;border-bottom:1px solid var(--line)}
.tabs button{background:transparent;border:0;border-bottom:2px solid transparent;border-radius:0;padding:10px 16px;font-size:14px;white-space:nowrap;color:var(--muted);font-weight:600}
.tabs button:hover{color:var(--jade)}
.tabs button.on{color:var(--jade);border-bottom-color:var(--gold)}
.tabp{display:none}.tabp.on{display:block}
.card{background:#fff;border:1px solid rgba(15,56,42,.08);border-radius:var(--r2);padding:20px;box-shadow:0 10px 30px -14px rgba(15,56,42,.12)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stack>*+*{margin-top:14px}
label{display:block;font-size:12px;color:var(--jade);margin-bottom:5px;font-weight:600;letter-spacing:.04em}
input,select,textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:var(--r);padding:10px 12px;color:var(--text)}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(212,175,55,.5);border-color:var(--jade)}
textarea{resize:vertical;min-height:70px}
.check{display:flex;gap:8px;align-items:center;font-weight:400;color:var(--muted)}.check input{width:auto}
.chat{height:260px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;margin:12px 0;padding-right:5px}
.bubble{background:var(--bg2);border-radius:10px 10px 10px 2px;padding:10px 13px;max-width:92%;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;border:1px solid rgba(15,56,42,.06)}
.bubble.user{align-self:flex-end;background:var(--jade);color:#FAF7F2;border-radius:10px 10px 2px 10px}
.inputrow{display:flex;gap:8px}.inputrow input{min-width:0}.inputrow button{white-space:nowrap}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}
.chips button{background:#fff;border:1px solid var(--line);border-radius:99px;padding:5px 12px;color:var(--muted);font-size:12px}
.chips button:hover{border-color:var(--gold);color:var(--jade)}
.tarot{height:170px;width:108px;border-radius:var(--r2);border:1px solid var(--gold);background:linear-gradient(150deg,var(--jade),var(--jade-d));color:#ffe088;margin:12px auto;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;box-shadow:0 10px 24px -10px rgba(15,56,42,.5);outline:1px solid rgba(212,175,55,.5);outline-offset:-6px}
.tarot .sym{font-size:42px}.tarot b{font-size:12px;padding:0 6px}
.center{text-align:center}
.task{width:100%;margin-top:8px;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:10px;font-size:13px}
.task:not(:disabled):hover{border-color:var(--gold)}
.score{font:700 48px "Noto Serif",Georgia,serif;color:var(--jade)}
.bar{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:13px;text-align:left}
.bar i{flex:0 0 92px;font-style:normal;color:var(--muted)}
.bar div{flex:1;height:8px;background:var(--bg2);border-radius:99px;overflow:hidden}
.bar u{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#3f6656,var(--jade))}
.bar b{flex:0 0 28px;text-align:right}
.pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.pil{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);text-align:center;padding:8px 2px}
.pil small{display:block}
.pil .h{font-family:"Noto Serif",serif;font-weight:700;font-size:clamp(22px,5vw,32px);line-height:1.2;margin:2px 0}
.pil.me{border:2px solid var(--gold);background:#fffaf0}
.shop-art{height:96px;display:grid;place-items:center;border-radius:var(--r);font-size:44px;margin-bottom:12px;position:relative}
.shop-art .badge{position:absolute;top:8px;left:8px;font-size:10px;background:#ffffffcc;border-radius:var(--r);padding:1px 8px;color:var(--jade)}
.product{display:flex;flex-direction:column}
.product p{min-height:40px;font-size:12px;color:var(--muted);margin:5px 0;flex:1}
.product.rec{border:1px solid var(--gold);box-shadow:0 0 0 2px rgba(212,175,55,.3)}
.price{font-size:15px;color:var(--jade);font-weight:700}
.product .btn{width:100%;margin-top:12px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filters button{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:5px 14px;font-size:13px}
.filters button.on{background:var(--jade);color:#FAF7F2;border-color:var(--jade)}
.recbar{background:rgba(212,175,55,.14);border:1px solid rgba(212,175,55,.6);border-radius:var(--r);padding:12px 16px;margin-bottom:14px;font-size:13px}
.entry{border-top:1px solid var(--line);padding:12px 0;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.notice{font-size:12px;color:var(--muted);line-height:1.7}
.result-text{white-space:pre-line;font-size:14px}
.empty{padding:26px;text-align:center;border:1px dashed rgba(15,56,42,.3);border-radius:var(--r2);color:var(--muted);background:#ffffff80}
.foot{margin-top:50px;padding:28px 0;background:var(--jade);color:#c1ecd7}
.foot .brand .bn{color:#FAF7F2}.foot small,.foot .notice{color:#a5d0bc}
.foot .row{align-items:start}
.textbtn{border:0;background:none;text-decoration:underline;font-size:12px;color:var(--muted);padding:6px}
.foot .textbtn{color:#ffe088}
dialog{border:1px solid rgba(212,175,55,.5);border-radius:var(--r2);padding:26px;width:min(520px,calc(100% - 28px));max-height:90vh;color:var(--text);background:var(--bg)}
dialog::backdrop{background:rgba(0,34,23,.6);backdrop-filter:blur(4px)}
dialog h2{font-size:24px;margin-bottom:12px;font-family:"Noto Serif","Noto Serif KR",serif;color:var(--jade);font-weight:600}
dialog .two{gap:12px}
dialog .close{float:right;border:0;background:var(--bg2);border-radius:50%;width:30px;height:30px;color:var(--jade)}
#drawer{position:fixed;top:0;right:0;height:100%;width:min(380px,100%);background:var(--bg);border-left:1px solid var(--gold);z-index:40;transform:translateX(100%);transition:transform .3s;display:flex;flex-direction:column;padding:18px}
#drawer.open{transform:none}
#items{flex:1;overflow:auto;margin:12px 0}
.ci{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.ci>span{font-size:28px}.ci>div{flex:1}.ci button{background:none;border:0;color:var(--muted);font-size:18px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--jade);color:#FAF7F2;border:1px solid var(--gold);padding:11px 20px;border-radius:var(--r);z-index:60;max-width:90%;font-size:13px;font-weight:600}
#toast:empty{display:none}
[hidden]{display:none!important}
@media(max-width:860px){
  .studio{grid-template-columns:1fr;gap:10px;padding-top:12px}
  .left{top:62px;z-index:9}
  .room{padding:8px 10px 10px}
  .seal{width:26px;height:28px;top:8px;right:8px}
  .pet svg{width:150px;height:156px}
  .room h3,.hide-m,.trayhead small{display:none}
  .trayhead{margin:6px 0;padding-top:6px}
  .tray{display:flex;overflow-x:auto;scrollbar-width:none}
  .ti{flex:0 0 66px}
  .trayinfo{margin-top:6px;min-height:0}
  .tabs{top:auto;position:static;margin-top:14px}
  .foot .row{flex-wrap:wrap}
}
@media(max-width:480px){.pill{padding:4px 8px;font-size:12px}.brand .bn{font-size:20px}.brand .bs{display:none}header .wrap{gap:6px}.pillars{gap:5px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>

const MB=[[1,6,1],[2,4,2],[3,6,3],[4,5,4],[5,6,5],[6,6,6],[7,7,7],[8,8,8],[9,8,9],[10,8,10],[11,7,11],[12,7,0]];
function saju(date,time){
  const [y,m,d]=date.split('-').map(Number);const v=m*100+d;
  const sy=(m<2||(m===2&&d<4))?y-1:y;
  const ys=((sy-4)%10+10)%10,yb=((sy-4)%12+12)%12;
  let mb=0;for(const [mm,dd,b] of MB)if(v>=mm*100+dd)mb=b;
  if(v<106)mb=0;
  const mi=(mb-2+12)%12,ms=((ys%5)*2+2+mi)%10;
  const jdn=Math.floor(Date.UTC(y,m-1,d)/86400000)+2440588;
  const di=((jdn+49)%60+60)%60,ds=di%10,db=di%12;
  let hour=null;
  if(time){const hh=+time.split(':')[0];const hb=Math.floor((hh+1)/2)%12;hour=[(ds*2+hb)%10,hb]}
  const p={year:[ys,yb],month:[ms,mb],day:[ds,db],hour};
  const cnt=[0,0,0,0,0];
  [p.year,p.month,p.day,p.hour].forEach(x=>{if(!x)return;cnt[STEM[x[0]][2]]++;cnt[BR[x[1]][2]]++});
  const mn=Math.min(...cnt),mx=Math.max(...cnt);
  const lack=cnt.map((n,i)=>n===mn?i:-1).filter(i=>i>=0);
  const top=cnt.map((n,i)=>n===mx?i:-1).filter(i=>i>=0);
  return {p,cnt,lack,top,animal:yb,yang:ys%2===0,theme:lack[hash(date)%lack.length]};
}
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=seed;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function zodiacOf(date){const [,m,d]=date.split('-').map(Number),v=m*100+d;
  if(v>=1222||v<120)return 0;if(v<219)return 1;if(v<321)return 2;if(v<420)return 3;if(v<521)return 4;if(v<622)return 5;if(v<723)return 6;if(v<823)return 7;if(v<923)return 8;if(v<1023)return 9;if(v<1122)return 10;return 11}

function renderTray(){

    const isOn=w[g.s]===g.id,tr=preview[g.s]===g.id&&!state.owned.includes(g.id),own=state.owned.includes(g.id);
    return `<button class="ti ${isOn?'on':''} ${tr?'try':''}" data-id="${g.id}" title="${esc(L(g.n))}"><span>${g.i}</span>${T('slots')[g.s]}<em class="tag" style="font-style:normal">${own?'✓':'✦'+g.p}</em></button>`}).join('');
  $('tray').querySelectorAll('button').forEach(b=>b.onclick=()=>pickItem(b.dataset.id));
  // info line: the last touched item
  const g=VITEMS.find(x=>x.id===lastItem);
  if(!g){$('trayInfo').textContent=T('v_none');return}
  const own=state.owned.includes(g.id),isOn=w[g.s]===g.id;
  if(own)$('trayInfo').innerHTML=`<span>${g.i} <b style="color:var(--text)">${esc(L(g.n))}</b><br>${isOn?T('v_worn'):T('v_owned')}</span>`;

let lastItem=null;
function pickItem(id){
  const g=VITEMS.find(x=>x.id===id);if(!g)return;
  lastItem=id;
  const own=state.owned.includes(id);
  const nowOn=worn()[g.s]===id;
  if(own){                                   // owned: toggle wear
    delete preview[g.s];
    if(nowOn)delete state.equipped[g.s];else state.equipped[g.s]=id;
    save();
  }else{                                     // not owned: instant try-on preview
    if(nowOn)delete preview[g.s];else preview[g.s]=id;
  }
  renderPet();bump();
}
function getItem(id){
  const g=VITEMS.find(x=>x.id===id);if(!g)return;
  if(state.coins<g.p)return toast(T('v_short'));
  state.coins-=g.p;state.owned.push(id);track('shopv');
  delete preview[g.s];state.equipped[g.s]=id;
  save();render();bump();toast(T('v_on'));
}

other:{ko:['이야기해 줘서 고마워. 그중 오늘 가장 마음에 남은 순간을 하나 더 말해줄래?','응, 듣고 있어. 그때 어떤 기분이 들었는지 조금만 더 들려줄래?'],en:['Thanks for telling me. Which moment stayed with you most today?','I\'m listening. Tell me a bit more about how it felt?']}};
const MEMLINE={tired:{ko:'지난번에 많이 지쳐 보였는데, 오늘은 좀 어때?',en:'You seemed worn out last time — how is today?'},fear:{ko:'지난번에 걱정이 있었잖아. 그건 어떻게 됐어?',en:'You were worried last time. How did it go?'},happy:{ko:'지난번에 좋은 일이 있었지! 그 기분 아직 남아 있어?',en:'You had good news last time! Is the feeling still here?'},love:{ko:'지난번에 설레는 이야기를 했었지. 그 뒤로 어때?',en:'You told me something fluttery last time. Any news?'}};
function rule(t){
  const p=state.pet;let cat='other';for(const [k,re] of CATS)if(re.test(t)){cat=k;break}
  const pool=REPLY[cat][lang];let r=pool[hash(t+today())%pool.length];
  if(state.mem&&state.mem.day!==today()&&MEMLINE[state.mem.cat])r=L(MEMLINE[state.mem.cat])+' '+r;
  if(p.tone==='clear')r=(lang==='ko'?'차근차근 정리해 보자. ':'Let\'s sort it out step by step. ')+r;
  if(p.tone==='play')r=(lang==='ko'?'수호 에너지 충전! ✨ ':'Guardian energy charged! ✨ ')+r;
  if(p.mbti&&p.mbti[2]==='F'&&cat!=='other')r+=lang==='ko'?' (네 마음이 먼저야.)':' (Your feelings come first.)';
  if(p.mbti&&p.mbti[2]==='T'&&cat==='fear')r+=lang==='ko'?' 우선순위를 번호로 적어볼까?':' Want to number your priorities?';
  r+=' '+L(AN[p.animal].sig);
  if(cat!=='other')state.mem={cat,day:today()};
  return r;
}
async function reply(t){
  if(!AI_ENDPOINT)return rule(t);
  try{
    const p=state.pet,res=await fetch(AI_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pet:{name:p.name,animal:AN[p.animal].en,element:EL[p.element].en,yang:p.yang,tone:p.tone,mbti:p.mbti,lang},messages:state.chats.slice(-12).concat({role:'user',text:t})})});
    const j=await res.json();if(j&&typeof j.reply==='string')return j.reply.slice(0,800);
  }catch(e){}
  return rule(t);
}
async function chat(text){
  if(!needPet())return;
  const t=text.trim().slice(0,300);if(!t)return;
  state.chats.push({role:'user',text:t});track('chat');renderChat();$('message').value='';
  const r=await reply(t);
  state.chats.push({role:'pet',text:r});state.chats=state.chats.slice(-40);save();renderChat();
}
$('chatForm').onsubmit=e=>{e.preventDefault();chat($('message').value)};
function clearChat(){if(!confirm(T('confirm_chat')))return;state.chats=[];save();renderChat()}

/* ================= RITUAL ================= */
function addXp(n){state.coins+=n;state.xp+=n}
function completeTask(i){
  if(!needPet())return;const d=dayData();if(d.tasks.includes(i))return;
  d.tasks.push(i);addXp(10);save();render();toast(T('task_done'));
}
function drawTarot(){
  if(!needPet())return;const d=dayData();if(d.card!==null)return;
  d.card=hash(today()+state.pet.date)%TAROT.length;track('tarot');
  const c=TAROT[d.card];
  state.chats.push({role:'pet',text:fmt(T('tarot_pet'),{n:state.pet.name,c:L({ko:c[1],en:c[2]}),s:fmt(T('tarot_q'),{k:L({ko:c[3],en:c[4]}),n:state.pet.name})})});
  state.chats=state.chats.slice(-40);save();render();
}
$('zPick').onchange=()=>{state.zsel=+$('zPick').value;save();renderRitual()};

/* ================= SHOP / CART ================= */
function addCart(id){const f=state.cart.find(c=>c.id===id);f?f.q++:state.cart.push({id,q:1});track('cart');save();renderCart();toast(T('added'))}
function renderCart(){
  $('cartN').textContent=state.cart.reduce((a,c)=>a+c.q,0);
  if(!state.cart.length){$('items').innerHTML=`<p class="muted" style="padding-top:16px">${T('empty')}</p>`;$('total').textContent='$0';return}
  let tot=0;
  $('items').innerHTML=state.cart.map(c=>{const g=GOODS.find(x=>x.id===c.id);tot+=g.p*c.q;return `<div class="ci"><span>${g.i}</span><div>${esc(L(g.n))}<br><small>$${g.p} × ${c.q}</small></div><button data-id="${c.id}">✕</button></div>`}).join('');
  $('total').textContent='$'+tot;
  $('items').querySelectorAll('button').forEach(b=>b.onclick=()=>{state.cart=state.cart.filter(c=>c.id!==+b.dataset.id);save();renderCart()});
}
$('cartBtn').onclick=()=>$('drawer').classList.add('open');
$('closeCart').onclick=()=>$('drawer').classList.remove('open');
$('checkout').onclick=()=>alert(T('checkout_msg'));

/* ================= CHEMISTRY ================= */
$('preset').onchange=()=>{const p=PRESETS.find(x=>x.id===$('preset').value);$('partner').value=p?L(p.n):'';$('partnerDate').value=p?p.d:'';$('partnerMbti').value=p?p.m:''};
const HE=[[0,1],[2,11],[3,10],[4,9],[5,8],[6,7]],SAM=[[8,0,4],[11,3,7],[2,6,10],[5,9,1]];
function animalRel(a,b){
  if(a===b)return['same',10];
  if(HE.some(([x,y])=>(x===a&&y===b)||(x===b&&y===a)))return['he',20];
  if(SAM.some(g=>g.includes(a)&&g.includes(b)))return['sam',16];
  if(Math.abs(a-b)===6)return['clash',4];
  return['norm',8];
}
function elemRel(a,b){const d=(b-a+5)%5;return d===0?['same',8]:(d===1||d===4)?['gen',14]:['ctl',6]}
function compat(me,her){
  const [ar,as]=animalRel(me.animal,her.animal),[er,es]=elemRel(me.element,her.element);
  const ys=me.yang!==her.yang?10:5;
  let ms=null;
  if(me.mbti&&her.mbti){ms=0;for(let i=0;i<4;i++)if(me.mbti[i]===her.mbti[i])ms+=2}
  const score=Math.min(99,50+as+es+ys+(ms||0));
  return {score,ar,as,er,es,ys,ms};
}
$('matchForm').onsubmit=e=>{
  e.preventDefault();if(!needPet())return;
  const name=$('partner').value.trim(),date=$('partnerDate').value;
  if(!name||!validDate(date))return toast(T('bad_input'));
  const s=saju(date,null),her={name,date,mbti:$('partnerMbti').value,animal:s.animal,yang:s.yang,element:s.theme};
  state.match={her:{name,mbti:her.mbti,animal:her.animal,yang:her.yang,element:her.element},...compat(state.pet,her)};
  track('match');save();renderMatch();
};
function renderMatch(){
  const m=state.match;$('matchEmpty').hidden=!!m;$('matchResult').hidden=!m;
  if(!m||!state.pet)return;
  const p=state.pet;
  $('mePet').innerHTML=petSVG(p.animal,p.element,p.yang);$('herPet').innerHTML=petSVG(m.her.animal,m.her.element,m.her.yang);
  $('mTitle').textContent=fmt(T('m_title'),{a:p.name,b:m.her.name});
  $('mScore').textContent=m.score;
  $('mStory').textContent=T('m_story')[m.score>=80?0:m.score>=70?1:2];
  const bars=[[T('m_parts')[0],m.as,20,T('rel')[m.ar]],[T('m_parts')[1],m.es,14,T('erel')[m.er]],[T('m_parts')[2],m.ys,10,m.ys===10?(lang==='ko'?'음양 보완':'Complementary'):(lang==='ko'?'같은 결':'Same polarity')],[T('m_parts')[3],m.ms,8,m.ms===null?T('m_na'):`${m.ms}/8`]];
  $('mBars').innerHTML=bars.map(([l,v,mx,note])=>`<div class="bar"><i>${l}</i><div><u style="width:${v===null?0:v/mx*100}%"></u></div><b style="flex-basis:auto;min-width:60px;font-weight:400;font-size:11px;color:var(--muted)">${esc(note)}</b></div>`).join('');
  $('mExplain').textContent=fmt(T('m_exp'),{a:m.as,b:m.es,c:m.ys,d:m.ms===null?T('m_na'):m.ms});
}
function cardSVG(){
  const m=state.match,p=state.pet;
  const star=['♥','✧','✦'];
  return `<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1100" viewBox="0 0 900 1100">
  <rect width="900" height="1100" rx="40" fill="#f7f1e9"/><rect x="40" y="40" width="820" height="1020" rx="30" fill="none" stroke="#baaacb"/>
  <g font-family="Georgia,serif" text-anchor="middle" fill="#59476b">
    <text x="450" y="140" font-size="46" letter-spacing="8">☾ YUNSEULDANG</text>
    <text x="450" y="190" font-size="18" letter-spacing="6" font-family="sans-serif">OUR LITTLE CONNECTION</text>
  </g>
  <g transform="translate(40,260) scale(1.6)">${petInner(p.animal,p.element,p.yang)}</g>
  <g transform="translate(440,260) scale(1.6)">${petInner(m.her.animal,m.her.element,m.her.yang)}</g>
  <g font-family="sans-serif" text-anchor="middle" fill="#59476b">
    <text x="450" y="760" font-size="34">${esc(p.name)} × ${esc(m.her.name)}</text>
    <text x="450" y="880" font-size="100" font-family="Georgia,serif">${m.score}</text>
    <text x="450" y="930" font-size="22">${esc(lang==='ko'?'윤슬 케미 지수 · 오락용':'Yunseul Chemistry · for fun')}</text>
    <text x="450" y="1010" font-size="16">${esc(lang==='ko'?'샘플 규칙 결과 · 실제 관계 예측이 아닙니다':'Fixed-rule result · not a real relationship prediction')}</text>
  </g></svg>`;
}
function dl(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function downloadCard(){
  if(!state.match)return;const svg=cardSVG();track('share');save();
  const img=new Image();
  img.onload=()=>{try{const c=document.createElement('canvas');c.width=900;c.height=1100;c.getContext('2d').drawImage(img,0,0);c.toBlob(b=>b?dl(b,'yunseuldang-duo.png'):dl(new Blob([svg],{type:'image/svg+xml'}),'yunseuldang-duo.svg'),'image/png')}catch(e){dl(new Blob([svg],{type:'image/svg+xml'}),'yunseuldang-duo.svg')}};
  img.onerror=()=>dl(new Blob([svg],{type:'image/svg+xml'}),'yunseuldang-duo.svg');
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  toast(T('card_saved'));
}
async function shareMatch(){
  if(!state.match)return;track('share');save();
  const text=fmt(T('share_t'),{a:state.pet.name,b:state.match.her.name,s:state.match.score});
  try{
    if(navigator.share){await navigator.share({title:'Yunseuldang',text});return}
    if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);toast(T('copy'));return}
  }catch(e){if(e.name==='AbortError')return}
  info(T('copyshare'),text);
}

/* ================= JOURNAL ================= */
$('journalForm').onsubmit=e=>{
  e.preventDefault();if(!needPet())return;
  const text=$('memo').value.trim();if(!text)return;
  state.entries.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),day:today(),mood:+$('mood').value,text:text.slice(0,500)});
  state.entries=state.entries.slice(-60);save();render();$('memo').value='';toast(T('journal_saved'));
};
function deleteEntry(id){if(!confirm(T('confirm_entry')))return;state.entries=state.entries.filter(e=>e.id!==id);save();render()}
function weekly(){
  const d=new Date();d.setDate(d.getDate()-6);const start=dstr(d),end=today();
  const ents=state.entries.filter(e=>e.day>=start&&e.day<=end);
  const tasks=Object.keys(state.days).filter(k=>k>=start&&k<=end).reduce((n,k)=>n+state.days[k].tasks.length,0);
  const mo={};for(const e of ents)mo[e.mood]=(mo[e.mood]||0)+1;
  const ms=Object.entries(mo).map(([m,n])=>`${T('moods')[m]} ${n}${T('times')}`).join(' · ')||T('wk_none');
  info(T('wk_h'),`${start} ~ ${end}\n\n`+fmt(T('wk_body'),{e:ents.length,t:tasks,m:ms}));
}

/* ================= INFO / METRICS / RESET ================= */
function info(title,text){$('infoTitle').textContent=title;$('infoBody').textContent=text;$('infoDialog').showModal()}
function showMetrics(){
  const m=state.metrics,g=k=>m[k]||0,mt=T('mt');
  const rate=g('start')?Math.round(g('done')/g('start')*100)+'%':'-';
  info(T('metrics_h'),Object.keys(mt).map(k=>`${mt[k]}: ${g(k)}`).join('\n')+`\n\n${T('mt_rate')}: ${rate}\n\n${T('mt_note')}`);
}
function resetAll(){
  if(!confirm(T('confirm_reset')))return;
  state=fresh();try{localStorage.removeItem(LS)}catch(e){}
  render();toast(T('reset_done'));
}

/* ================= INIT ================= */
for(const id of['birthday','partnerDate'])$(id).max=today();
applyLang();
if(!storageOK)toast(T('saved_fail'));
document.addEventListener('visibilitychange',()=>{if(!document.hidden){for(const id of['birthday','partnerDate'])$(id).max=today();render()}});
