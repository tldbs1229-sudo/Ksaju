<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#FAF7F2">
<script>try{if(localStorage.getItem('yd-theme')==='dark')document.documentElement.dataset.theme='dark'}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Noto+Serif+KR:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<title>윤슬당 YUNSEULDANG · 나의 수호동물</title>
<meta name="description" content="사주·타로·별자리로 만나는 나만의 수호동물. 12간지 × 오행 × 음양 캐릭터, 궁합, 오행 소품 샵.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="wrap">
    <a href="#" class="brand"><span class="bn">윤슬당</span><span class="bs">YUNSEULDANG · 오행 수호동물</span></a>
    <span style="flex:1"></span>
    <span class="pill" id="wallet" hidden></span>
    <button class="pill" id="themeBtn" aria-label="theme">🌙</button>
    <button class="pill" id="langBtn">EN</button>
    <button class="pill" id="cartBtn" hidden>🛒 <b id="cartN">0</b></button>
  </div>
</header>

<!-- PIXEL PET: home (tamagotchi device + birth form + four banners) and the banner screens -->
<div class="px" id="px">
  <section class="px-home" id="pxHome">
    <p class="px-kicker" data-i18n="px_kicker"></p>
    <h1 class="px-title" id="pxTitle"></h1>
    <div class="tama" id="tama">
      <svg class="tama-orn" id="tamaOrn" viewBox="0 0 120 24" aria-hidden="true"></svg>
      <div class="tama-screen" id="tamaScreen">
        <div class="scr-fx" id="scrFx" aria-hidden="true"></div>
        <span class="tuft l" aria-hidden="true"></span><span class="tuft r" aria-hidden="true"></span>
        <div class="pet-walk" id="petWalk"><div class="pet-flip"><div class="pet-jump" id="petJump"><div class="pet-breathe">
          <img id="petA" alt=""><img id="petB" class="pet-blink" alt="" aria-hidden="true">
        </div></div></div></div>
        <div class="px-egg" id="pxEgg" hidden aria-hidden="true"></div>
        <span class="px-say" id="pxSay" hidden></span>
      </div>
      <div class="tama-btns">
        <button type="button" class="tb" id="tbPrev"><svg viewBox="0 0 10 12"><path d="M8 1L2 6l6 5z"/></svg></button>
        <button type="button" class="tb ok" id="tbOk"><svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="4.5"/></svg></button>
        <button type="button" class="tb" id="tbNext"><svg viewBox="0 0 10 12"><path d="M2 1l6 5-6 5z"/></svg></button>
      </div>
    </div>
    <div class="px-plate" id="pxPlate"></div>

    <form class="px-card px-form" id="pxForm">
      <h2 class="px-h" data-i18n="px_form_h"></h2>
      <label for="pxDate" data-i18n="px_date"></label>
      <input type="date" id="pxDate" min="1900-01-01" required>
      <label for="pxTime" data-i18n="px_time"></label>
      <div class="px-row"><input type="time" id="pxTime"><label class="px-check"><input type="checkbox" id="pxNoTime"><span data-i18n="px_notime"></span></label></div>
      <label for="pxName" data-i18n="px_name"></label>
      <input id="pxName" maxlength="12" data-i18n-ph="px_name_ph">
      <button class="px-btn" data-i18n="px_go"></button>
      <p class="px-small" data-i18n="px_privacy"></p>
    </form>
    <div class="px-card px-me" id="pxMe" hidden></div>

    <div class="px-banners" id="pxBanners"></div>
    <p class="px-note" data-i18n="px_note"></p>
  </section>

  <section class="px-view" id="pxView" hidden>
    <button type="button" class="px-back" id="pxBack" data-i18n="px_back"></button>
    <h2 class="px-h" id="pxViewTitle"></h2>
    <div class="px-card px-talk"><div class="px-mini" id="pxViewPet"></div><p class="px-bubble" id="pxViewSay"></p></div>
    <p class="px-note" data-i18n="px_note"></p>
  </section>
</div>

<!-- previous site, hidden while the pixel-pet redesign is built; cleaned up in step 6 -->
<div id="legacy" hidden>

<!-- LANDING: pet device + product cards -->
<section class="landing" id="landing">
  <div class="lhero">
    <button type="button" class="logintab" id="loginTab"></button>
    <h1 class="lh-title" id="lhTitle"></h1>
    <div class="device" id="device">
      <div class="dv-top"><i>✦</i><span>윤슬 펫 뽑기</span><i>✦</i></div>
      <div class="dv-screen" id="dvScreen">
        <div class="spot s1" aria-hidden="true"></div><div class="spot s2" aria-hidden="true"></div>
        <div class="rail r1" aria-hidden="true"></div><div class="rail r2" aria-hidden="true"></div>
        <div class="claw" id="claw" aria-hidden="true"><span class="cart"></span><i class="rope" id="rope"></i><div class="head" id="clawHead"><b class="pl"></b><b class="pc"></b><b class="pr"></b><span class="grab" id="grab"></span></div></div>
        <div class="balls" id="balls"></div>
        <div class="chute" id="chute" aria-hidden="true">PRIZE</div>
        <div class="glass" aria-hidden="true"></div>
        <div class="reveal" id="reveal" hidden><div class="rays"></div><div class="rv-card"><img id="dvImg" alt=""></div><p class="rv-t" id="rvT"></p><button type="button" class="rv-again" id="rvAgain"></button><div class="confetti" id="confetti"></div></div>
        <span class="dv-bubble" id="dvBubble" hidden></span>
      </div>
      <div class="dv-logo" aria-hidden="true">Yunseul</div>
      <div class="dv-ctrl">
        <div class="dv-panel"><span class="slot"><i></i>COIN</span><span class="credit" id="credit">01</span><span class="door" id="door" aria-hidden="true">★★★</span></div>
        <div class="dv-panel"><span class="joy" id="joy" aria-hidden="true"><i></i></span><button type="button" class="dv-btn" id="dvBtn"><span>PUSH</span></button></div>
      </div>
    </div>
    <p class="lh-cap" id="lhCap"></p>
  </div>
  <div class="lsheet">
    <div class="wrap">
      <div class="pgrid" id="pgrid"></div>
      <p class="notice center" style="margin-top:16px" data-i18n-html="h_note"></p>
    </div>
  </div>
</section>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <clipPath id="cp-heart" clipPathUnits="objectBoundingBox"><path d="M.5 .96C.17 .74 0 .54 0 .32 0 .14 .14 0 .3 0 .4 0 .47 .05 .5 .13 .53 .05 .6 0 .7 0 .86 0 1 .14 1 .32 1 .54 .83 .74 .5 .96Z"/></clipPath>
  <clipPath id="cp-ears" clipPathUnits="objectBoundingBox"><path d="M.1 .36C.06 .1 .18 0 .29 .02 .4 .04 .44 .17 .5 .17 .56 .17 .6 .04 .71 .02 .82 0 .94 .1 .9 .36 .98 .46 1 .58 1 .7 1 .9 .82 1 .5 1 .18 1 0 .9 0 .7 0 .58 .02 .46 .1 .36Z"/></clipPath>
  <clipPath id="cp-star" clipPathUnits="objectBoundingBox"><path d="M.5 .02C.56 .02 .6 .2 .66 .3 .72 .38 .95 .34 .98 .42 1 .5 .82 .62 .8 .7 .78 .8 .88 .96 .8 1 .72 1.03 .58 .88 .5 .88 .42 .88 .28 1.03 .2 1 .12 .96 .22 .8 .2 .7 .18 .62 0 .5 .02 .42 .05 .34 .28 .38 .34 .3 .4 .2 .44 .02 .5 .02Z"/></clipPath>
  <clipPath id="cp-flower" clipPathUnits="objectBoundingBox"><path d="M.23 .27A.27 .27 0 1 0 .77 .27A.27 .27 0 1 0 .23 .27ZM.46 .5A.27 .27 0 1 0 1 .5A.27 .27 0 1 0 .46 .5ZM.23 .73A.27 .27 0 1 0 .77 .73A.27 .27 0 1 0 .23 .73ZM0 .5A.27 .27 0 1 0 .54 .5A.27 .27 0 1 0 0 .5ZM.2 .5A.3 .3 0 1 0 .8 .5A.3 .3 0 1 0 .2 .5Z"/></clipPath>
</svg>

<main class="wrap">
 <div class="studio">
  <!-- LEFT: character + try-on tray (always visible) -->
  <aside class="left">
    <div class="room" id="room">
      <div class="seal" aria-hidden="true"><span>五行</span></div>
      <span class="badge" id="petBadge"></span>
      <button type="button" class="guide-chip" id="guideChip" onclick="goTab('guide')"></button>
      <div id="petArt" class="pet"></div>
      <h3 id="petTitle"></h3>
      <small id="petSub" class="hide-m"></small>
      <div class="hide-m"><div class="meter"><i id="progress"></i></div><small id="level"></small></div>
      <div class="trayhead"><h4 data-i18n="tray_h"></h4><small data-i18n="tray_hint"></small></div>
      <div class="tray" id="tray"></div>
      <div class="trayinfo" id="trayInfo"></div>
      <div class="mini hide-m">
        <button class="btn sm" id="humanBtn" onclick="toggleHuman()" hidden></button>
        <button class="btn sm" onclick="toggleMode()" data-i18n="sa_mode"></button>
        <button class="btn sm" onclick="openBirth()" data-i18n="sa_set"></button>
      </div>
    </div>
  </aside>

  <!-- RIGHT: title + tabs -->
  <div class="right">
    <div class="hero">
      <div class="tag">AI · K-FORTUNE · SHAMANISM</div>
      <p class="lead" data-i18n-html="h_lead"></p>
    </div>

    <div class="tabs" id="tabs" role="tablist">
      <button data-tab="chat" class="on" data-i18n="tab_chat"></button>
      <button data-tab="guide" data-i18n="tab_guide"></button>
      <button data-tab="farm" data-i18n="tab_farm"></button>
      <button data-tab="today" data-i18n="tab_today"></button>
      <button data-tab="chart" data-i18n="tab_chart"></button>
      <button data-tab="match" data-i18n="tab_match"></button>
      <button data-tab="shop" data-i18n="tab_shop"></button>
      <button data-tab="journal" data-i18n="tab_journal"></button>
    </div>

    <!-- CHAT -->
    <section class="tabp on" id="tab-chat">
      <div id="welcome" class="empty">
        <p data-i18n="sa_empty"></p>
        <div class="actions" style="justify-content:center"><button class="btn primary" onclick="openBirth()" data-i18n="h_cta1"></button></div>
      </div>
      <div id="mySpace" class="card" hidden>
        <div class="row"><h3 data-i18n="chat_h"></h3><span class="pill" id="aiMode"></span></div>
        <small data-i18n="chat_note"></small>
        <div id="chatLog" class="chat" role="log" aria-live="polite"></div>
        <form id="chatForm" class="inputrow">
          <input id="message" maxlength="300" required data-i18n-ph="chat_ph" aria-label="chat">
          <button class="btn primary" data-i18n="send"></button>
        </form>
        <div class="chips" id="chips"></div>
        <div class="row"><small data-i18n="chat_keep"></small><button class="textbtn" onclick="clearChat()" data-i18n="chat_clear"></button></div>
      </div>
    </section>

    <!-- GUIDE (main human character) -->
    <section class="tabp" id="tab-guide">
      <div id="guideEmpty" class="empty"><p data-i18n="sa_empty"></p><div class="actions" style="justify-content:center"><button class="btn primary" onclick="openBirth()" data-i18n="h_cta1"></button></div></div>
      <div id="guideBox" hidden>
        <div class="card prof">
          <img id="gPoster" class="poster" alt="">
          <div>
            <span class="pill" id="gEl"></span>
            <h2 id="gName"></h2>
            <p class="muted" id="gTag"></p>
            <dl class="kv" id="gKv"></dl>
            <div class="tagl" id="gTags"></div>
            <p class="quote" id="gQuote"></p>
            <h4 data-i18n="g_items"></h4><div class="tagl" id="gItems"></div>
            <h4 style="margin-top:10px" data-i18n="g_why"></h4><p id="gWhy" style="font-size:13px"></p>
          </div>
        </div>
        <div class="two" style="margin-top:16px">
          <div class="card"><h3 data-i18n="g_today"></h3><img id="gChibi" class="chibi" alt=""><p id="gDaily" style="font-size:14px"></p></div>
          <div class="card"><h3 data-i18n="g_friends"></h3><small data-i18n="g_friends_s"></small><div id="gFriends" class="friends"></div></div>
        </div>
      </div>
    </section>

    <!-- FARM (12 zodiac pets) -->
    <section class="tabp" id="tab-farm">
      <div id="farmEmpty" class="empty"><p data-i18n="sa_empty"></p><div class="actions" style="justify-content:center"><button class="btn primary" onclick="openBirth()" data-i18n="h_cta1"></button></div></div>
      <div id="farmBox" hidden>
        <h3 id="farmTitle"></h3><p class="muted" style="font-size:13px;margin-bottom:14px" id="farmSub"></p>
        <div class="two">
          <div class="card center">
            <span class="pill" id="fpBadge"></span>
            <div class="pet-img" style="max-width:340px"><img id="fpImg" alt=""></div>
            <h3 id="fpName" style="margin-top:10px"></h3><small id="fpSub"></small>
            <div class="stage" id="fpStage" style="justify-content:center"></div>
            <small id="fpNext"></small>
          </div>
          <div class="card center" id="huCard"></div>
        </div>
        <h3 style="margin-top:20px" data-i18n="farm_roster"></h3><small id="farmRosterSub"></small>
        <div class="farm" id="farmGrid"></div>
      </div>
    </section>

    <!-- TODAY -->
    <section class="tabp" id="tab-today">
      <div class="row" style="margin-bottom:12px"><h3 data-i18n="ri_h"></h3><span class="pill" id="todayLabel"></span></div>
      <div class="grid">
        <div class="card center">
          <h3 data-i18n="ta_h"></h3><small data-i18n="ta_s"></small>
          <div class="tarot"><span class="sym" id="tIcon">✧</span><b id="tName">YUNSEUL</b></div>
          <p id="tText" class="muted" style="font-size:13px"></p>
          <button class="btn primary" style="margin-top:14px" id="drawBtn" onclick="drawTarot()"></button>
        </div>
        <div class="card">
          <h3 id="zName">✦</h3><small data-i18n="zo_s"></small>
          <div style="margin-top:10px"><select id="zPick" aria-label="zodiac"></select></div>
          <div id="zBars" style="margin-top:10px"></div>
          <p id="zText" style="font-size:13px"></p>
        </div>
        <div class="card">
          <h3 data-i18n="qu_h"></h3><small data-i18n="qu_s"></small>
          <div id="quests"></div>
          <p class="notice" style="margin-top:12px" data-i18n="qu_n"></p>
        </div>
      </div>
    </section>

    <!-- CHART -->
    <section class="tabp" id="tab-chart">
      <h3 data-i18n="ch_h"></h3><p class="muted" style="font-size:13px;margin-bottom:14px" data-i18n="ch_p"></p>
      <div id="chartEmpty" class="empty"><p data-i18n="sa_empty"></p><div class="actions" style="justify-content:center"><button class="btn primary" onclick="openBirth()" data-i18n="h_cta1"></button></div></div>
      <div id="chartBox" class="two" hidden>
        <div class="card">
          <div id="pillars" class="pillars"></div>
          <h4 data-i18n="ch_el"></h4>
          <div id="els" style="margin-top:8px"></div>
        </div>
        <div class="card">
          <span class="pill" data-i18n="ch_badge"></span>
          <div id="chartText" class="result-text" style="margin-top:12px"></div>
          <p class="notice" style="margin-top:14px" data-i18n="ch_warn"></p>
        </div>
      </div>
    </section>

    <!-- MATCH -->
    <section class="tabp" id="tab-match">
      <h3 data-i18n="m_h"></h3><p class="muted" style="font-size:13px;margin-bottom:14px" data-i18n="m_p"></p>
      <div class="two">
        <form id="matchForm" class="card stack">
          <div><label for="preset" data-i18n="m_preset"></label><select id="preset"></select></div>
          <div><label for="partner" data-i18n="m_name"></label><input id="partner" maxlength="20" required data-i18n-ph="m_name_ph"></div>
          <div><label for="partnerDate" data-i18n="m_date"></label><input id="partnerDate" type="date" min="1900-01-01" required></div>
          <div><label for="partnerMbti" data-i18n="m_mbti"></label><select id="partnerMbti"></select></div>
          <button class="btn primary" style="width:100%" data-i18n="m_go"></button>
          <p class="notice" data-i18n="m_note"></p>
        </form>
        <div class="card center" style="display:flex;flex-direction:column;justify-content:center">
          <div id="matchEmpty"><div style="font-size:50px">☾ · ✧</div><h3 data-i18n="m_empty_h"></h3><p class="muted" data-i18n-html="m_empty_p"></p></div>
          <div id="matchResult" hidden>
            <div class="row" style="justify-content:center;gap:10px;margin-bottom:10px">
              <div class="duo" id="mePet"></div>
              <div class="duo" id="herPet"></div>
            </div>
            <h3 id="mTitle"></h3>
            <div class="score" id="mScore"></div>
            <small data-i18n="m_unit"></small>
            <p id="mStory" style="margin:12px 0"></p>
            <div id="mBars"></div>
            <small id="mExplain" style="display:block;margin-top:8px"></small>
            <div class="actions" style="justify-content:center">
              <button class="btn primary" onclick="downloadCard()" data-i18n="m_dl"></button>
              <button class="btn" onclick="shareMatch()" data-i18n="m_share"></button>
            </div>
            <small data-i18n="m_priv"></small>
          </div>
        </div>
      </div>
    </section>

    <!-- SHOP (physical goods) -->
    <section class="tabp" id="tab-shop">
      <h3 data-i18n="sh_r"></h3><p class="muted" style="font-size:13px;margin-bottom:14px" data-i18n="sh_p"></p>
      <div class="recbar" id="recbar" hidden></div>
      <div class="filters" id="filters"></div>
      <div class="grid" id="products"></div>
      <p class="notice" style="margin-top:12px" data-i18n="sh_note"></p>
      <div class="two" style="margin-top:16px">
        <div class="card"><h3 data-i18n="sub_h"></h3><p class="muted" style="font-size:13px" data-i18n="sub_p"></p>
          <button class="btn sm" style="margin-top:12px" onclick="info(T('sub_h'),T('sub_d'))" data-i18n="more"></button></div>
        <div class="card"><h3 data-i18n="gd_h"></h3><p class="muted" style="font-size:13px" data-i18n="gd_p"></p>
          <button class="btn sm" style="margin-top:12px" onclick="info(T('gd_h'),T('gd_d'))" data-i18n="more"></button></div>
      </div>
    </section>

    <!-- JOURNAL -->
    <section class="tabp" id="tab-journal">
      <div class="row" style="margin-bottom:12px"><div><h3 data-i18n="jo_h"></h3><p class="muted" style="font-size:13px" data-i18n="jo_p"></p></div><button class="btn sm" onclick="weekly()" data-i18n="jo_week"></button></div>
      <div class="two">
        <form id="journalForm" class="card stack">
          <div><label for="mood" data-i18n="jo_mood"></label><select id="mood"></select></div>
          <div><label for="memo" data-i18n="jo_memo"></label><textarea id="memo" maxlength="500" required data-i18n-ph="jo_ph"></textarea></div>
          <button class="btn primary" data-i18n="jo_save"></button>
          <small data-i18n="jo_keep"></small>
        </form>
        <div class="card" id="entries"></div>
      </div>
    </section>
  </div>
 </div>
</main>
</div>

<footer class="foot"><div class="wrap"><div class="row">
  <div><div class="brand" style="font-size:20px">☾ 윤슬당</div><small>YUNSEULDANG · BY SIYUN &amp; YEAJIN</small></div>
  <div class="notice" data-i18n-html="foot"></div>
  <div><button class="textbtn" onclick="openPartner()" data-i18n="f_partner"></button><br><button class="textbtn" onclick="showMetrics()" data-i18n="f_metrics"></button><br><button class="textbtn" onclick="resetAll()" data-i18n="f_reset"></button></div>
</div></div></footer>

<dialog id="birthDialog">
  <button class="close" aria-label="close" onclick="this.closest('dialog').close()">×</button>
  <h2 data-i18n="b_h"></h2>
  <p class="notice" style="margin-bottom:16px" data-i18n="b_note"></p>
  <form id="birthForm" class="stack">
    <div><label for="nickname" data-i18n="b_name"></label><input id="nickname" maxlength="16" required data-i18n-ph="b_name_ph"></div>
    <div><label for="birthday" data-i18n="b_date"></label><input type="date" id="birthday" min="1900-01-01" required></div>
    <div class="two">
      <div><label for="birthTime" data-i18n="b_time"></label><input type="time" id="birthTime">
        <label class="check" style="margin-top:6px"><input type="checkbox" id="noTime" checked><span data-i18n="b_notime"></span></label></div>
      <div><label for="mbti" data-i18n="b_mbti"></label><select id="mbti"></select></div>
    </div>
    <div><label for="element" data-i18n="b_el"></label><select id="element"></select></div>
    <div class="two">
      <div><label for="tone" data-i18n="b_tone"></label><select id="tone"></select></div>
      <div><label for="sky" data-i18n="b_sky"></label><select id="sky"></select></div>
    </div>
    <small data-i18n="b_foot"></small>
    <button class="btn primary" style="width:100%" data-i18n="b_go"></button>
  </form>
</dialog>

<dialog id="partnerDialog">
  <button class="close" aria-label="close" onclick="this.closest('dialog').close()">×</button>
  <h2 data-i18n="p_h"></h2>
  <p class="notice" style="margin-bottom:16px" data-i18n="p_note"></p>
  <form id="partnerForm" class="stack" action="https://formspree.io/f/xnpjvwyy" method="POST">
    <div class="two">
      <div><label for="pName" data-i18n="p_name"></label><input id="pName" name="name" maxlength="50" required></div>
      <div><label for="pCompany" data-i18n="p_company"></label><input id="pCompany" name="company" maxlength="80"></div>
    </div>
    <div><label for="pEmail" data-i18n="p_email"></label><input id="pEmail" name="email" type="email" maxlength="120" required placeholder="you@company.com"></div>
    <div><label for="pType" data-i18n="p_type"></label><select id="pType" name="type" required>
      <option value="Goods / Retail" data-i18n="p_t1"></option>
      <option value="Content / IP Collaboration" data-i18n="p_t2"></option>
      <option value="Marketing / Influencer" data-i18n="p_t3"></option>
      <option value="Investment" data-i18n="p_t4"></option>
      <option value="Other" data-i18n="p_t5"></option>
    </select></div>
    <div><label for="pMsg" data-i18n="p_msg"></label><textarea id="pMsg" name="message" maxlength="2000" required data-i18n-ph="p_msg_ph" style="min-height:120px"></textarea></div>
    <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" style="display:none" aria-hidden="true">
    <label class="check"><input type="checkbox" id="pAgree" required><span data-i18n="p_agree"></span></label>
    <button class="btn primary" style="width:100%" id="pSend" data-i18n="p_send"></button>
    <p id="pStatus" class="notice" role="status" aria-live="polite"></p>
  </form>
</dialog>

<dialog id="infoDialog">
  <button class="close" aria-label="close" onclick="this.closest('dialog').close()">×</button>
  <h2 id="infoTitle"></h2>
  <div id="infoBody" class="result-text"></div>
</dialog>

<aside id="drawer">
  <div class="row"><h3 data-i18n="cart_h"></h3><button class="pill" id="closeCart">✕</button></div>
  <div id="items"></div>
  <div class="row" style="font-weight:700;margin-bottom:12px"><span data-i18n="total"></span><span id="total" style="color:var(--goldtxt)">$0</span></div>
  <button class="btn primary" id="checkout" data-i18n="checkout"></button>
</aside>
<div id="toast" role="status" aria-live="polite"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
